<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber I-Ching 賽博易經占卜儀 v0.4</title>
    <style>
        :root {
            --bg-color: #050508;
            --neon-red: #ff2a2a;
            --dark-red: #550000;
            --neon-cyan: #00f3ff;
            --border-color: rgba(255, 42, 42, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: #e0e6ed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        header {
            position: absolute;
            top: 20px;
            text-align: center;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        header h1 {
            font-size: 1.2rem;
            color: var(--neon-red);
            text-shadow: 0 0 10px rgba(255, 42, 42, 0.5);
        }

        header p {
            font-size: 0.7rem;
            color: #6c757d;
            margin-top: 4px;
        }

        .main-container {
            position: relative;
            width: 480px;
            height: 480px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 40px 0;
        }

        /* 中央太極核心 */
        .taiji-core {
            position: absolute;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: #000;
            border: 2px solid #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            overflow: hidden;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .taiji-svg {
            width: 100%;
            height: 100%;
        }

        /* 展開狀態：左右兩個獨立區塊裂開，中間留白容納爻 */
        .taiji-core.expanded {
            width: 340px;
            height: 160px;
            border-radius: 15px;
            background: rgba(10, 5, 5, 0.95);
            border: 2px solid var(--neon-red);
            box-shadow: 0 0 30px rgba(255, 42, 42, 0.4);
            justify-content: space-between;
            padding: 10px 15px;
        }

        .taiji-left, .taiji-right {
            display: none;
            align-items: center;
            justify-content: center;
            width: 75px;
            height: 130px;
        }

        .taiji-core.expanded .taiji-left,
        .taiji-core.expanded .taiji-right {
            display: flex;
        }

        .taiji-core:not(.expanded) .default-taiji-inner {
            display: block;
            width: 100%;
            height: 100%;
        }

        .taiji-core.expanded .default-taiji-inner {
            display: none;
        }

        /* 核心內部的爻卦顯示區：順序由下而上 (初爻在底部) */
        .inner-hexagram {
            display: none;
            flex-direction: column; /* 由下而上排列 */
            gap: 6px;
            width: 110px;
        }

        .taiji-core.expanded .inner-hexagram {
            display: flex;
        }

        .inner-yao {
            height: 5px;
            width: 100%;
            opacity: 0;
            border-radius: 2px;
            transition: opacity 0.3s ease;
        }

        .inner-yao.visible-dashed {
            opacity: 1;
            border: 1px dashed rgba(255, 42, 42, 0.7);
            background: transparent;
        }

        .inner-yao.visible-solid {
            opacity: 1;
            border: none;
            background: var(--neon-red);
            box-shadow: 0 0 6px var(--neon-red);
        }

        .inner-yao.visible-flash {
            opacity: 1;
            border: 1px dashed #ffb700;
            background: rgba(255, 183, 0, 0.3);
            box-shadow: 0 0 8px #ffb700;
            animation: flash 0.8s infinite alternate;
        }

        /* 外環八卦：紅黑配色、梯形且不旋轉、相互連在一起 */
        .bagua-ring {
            position: absolute;
            width: 440px;
            height: 440px;
            border-radius: 50%;
        }

        .bagua-item {
            position: absolute;
            width: 85px;
            height: 55px;
            /* 紅黑配色背景 */
            background: linear-gradient(135deg, var(--dark-red), #111);
            border: 1px solid var(--border-color);
            /* 梯形外型，無旋轉 */
            clip-path: polygon(15% 0%, 85% 0%, 100% 100%, 0% 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: grab;
            transition: all 0.2s;
            user-select: none;
        }

        .bagua-item:hover {
            border-color: var(--neon-red);
            background: linear-gradient(135deg, #770000, #220000);
            box-shadow: 0 0 12px var(--neon-red);
            transform: scale(1.05);
            z-index: 5;
        }

        .bagua-item .symbol {
            font-size: 1.1rem;
            font-weight: bold;
            color: #fff;
            line-height: 1;
        }

        .bagua-item .name {
            font-size: 0.55rem;
            color: var(--neon-red);
            margin-top: 2px;
        }

        /* 八卦位置固定環繞（完全不旋轉，方向一致） */
        .pos-li   { top: 15px;  left: 178px; }
        .pos-kun  { top: 75px;  left: 285px; }
        .pos-dui  { top: 182px; left: 340px; }
        .pos-qian { top: 290px; left: 285px; }
        .pos-kan  { top: 350px; left: 178px; }
        .pos-gen  { top: 290px; left: 70px;  }
        .pos-zhen { top: 182px; left: 15px;  }
        .pos-xun  { top: 75px;  left: 70px;  }

        /* 互動控制台 */
        .control-panel {
            margin-top: 15px;
            display: flex;
            gap: 12px;
        }

        .cyber-btn {
            background: transparent;
            border: 1px solid var(--neon-red);
            color: var(--neon-red);
            padding: 8px 16px;
            font-size: 0.75rem;
            letter-spacing: 2px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s;
            box-shadow: inset 0 0 5px rgba(255, 42, 42, 0.2);
        }

        .cyber-btn:hover {
            background: var(--neon-red);
            color: var(--bg-color);
            box-shadow: 0 0 15px var(--neon-red);
        }

        .status-bar {
            margin-top: 12px;
            font-size: 0.7rem;
            color: #ffb700;
            letter-spacing: 1px;
            height: 20px;
            text-align: center;
        }

        @keyframes flash {
            0% { opacity: 0.3; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Cyber I-Ching v0.4</h1>
        <p>紅黑梯形陣列與純黑白獨立太極展開</p>
    </header>

    <div class="main-container">
        <!-- 外環八卦 (紅黑梯形，不旋轉) -->
        <div class="bagua-ring" id="baguaRing">
            <div class="bagua-item pos-li" draggable="true" data-gua="離"><span class="symbol">☲</span><span class="name">離</span></div>
            <div class="bagua-item pos-kun" draggable="true" data-gua="坤"><span class="symbol">☷</span><span class="name">坤</span></div>
            <div class="bagua-item pos-dui" draggable="true" data-gua="兌"><span class="symbol">☱</span><span class="name">兌</span></div>
            <div class="bagua-item pos-qian" draggable="true" data-gua="乾"><span class="symbol">☰</span><span class="name">乾</span></div>
            <div class="bagua-item pos-kan" draggable="true" data-gua="坎"><span class="symbol">☵</span><span class="name">坎</span></div>
            <div class="bagua-item pos-gen" draggable="true" data-gua="艮"><span class="symbol">☶</span><span class="name">艮</span></div>
            <div class="bagua-item pos-zhen" draggable="true" data-gua="震"><span class="symbol">☳</span><span class="name">震</span></div>
            <div class="bagua-item pos-xun" draggable="true" data-gua="巽"><span class="symbol">☴</span><span class="name">巽</span></div>
        </div>

        <!-- 中央太極核心 -->
        <div class="taiji-core" id="taijiCore" title="點擊太極進行擲爻">
            <!-- 未展開時的純黑白太極 SVG -->
            <div class="default-taiji-inner">
                <svg class="taiji-svg" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="48" fill="#fff" stroke="#fff" stroke-width="2"/>
                    <path d="M50,2 A48,48 0 0,1 50,98 A24,24 0 0,1 50,50 A24,24 0 0,0 50,2 Z" fill="#000"/>
                    <circle cx="50" cy="26" r="5" fill="#fff"/>
                    <circle cx="50" cy="74" r="5" fill="#000"/>
                </svg>
            </div>

            <!-- 展開後的左半邊太極 (黑底白魚與小白點) -->
            <div class="taiji-left">
                <svg width="45" height="130" viewBox="0 0 45 100">
                    <path d="M45,2 A48,48 0 0,0 45,98 A24,24 0 0,0 45,50 A24,24 0 0,1 45,2 Z" fill="#000" stroke="#fff" stroke-width="2"/>
                    <circle cx="38" cy="26" r="4" fill="#fff"/>
                </svg>
            </div>

            <!-- 中央爻卦生成區 (順序由下而上：yao-1 在最下方) -->
            <div class="inner-hexagram" id="innerHexagram">
                <div class="inner-yao" id="yao-1"></div>
                <div class="inner-yao" id="yao-2"></div>
                <div class="inner-yao" id="yao-3"></div>
                <div class="inner-yao" id="yao-4"></div>
                <div class="inner-yao" id="yao-5"></div>
                <div class="inner-yao" id="yao-6"></div>
            </div>

            <!-- 展開後的右半邊太極 (白底黑魚與小黑點) -->
            <div class="taiji-right">
                <svg width="45" height="130" viewBox="0 0 45 100">
                    <path d="M0,98 A48,48 0 0,0 0,2 A24,24 0 0,0 0,50 A24,24 0 0,1 0,98 Z" fill="#fff" stroke="#fff" stroke-width="2"/>
                    <circle cx="7" cy="74" r="4" fill="#000"/>
                </svg>
            </div>
        </div>
    </div>

    <div class="status-bar" id="statusBar">系統就緒：請點擊中央太極核心開始擲初爻</div>

    <div class="control-panel">
        <button class="cyber-btn" id="tossBtn">擲爻 (1/6)</button>
        <button class="cyber-btn" id="resetBtn">重置</button>
    </div>

    <script>
        let currentYaoStep = 0;
        const totalYaos = 6;
        const taijiCore = document.getElementById('taijiCore');
        const tossBtn = document.getElementById('tossBtn');
        const resetBtn = document.getElementById('resetBtn');
        const statusBar = document.getElementById('statusBar');

        function performToss() {
            if (currentYaoStep >= totalYaos) {
                statusBar.textContent = "六爻已全數擲畢，請拖曳外圈紅黑梯形卦象填滿區域。";
                return;
            }

            if (currentYaoStep === 0) {
                taijiCore.classList.add('expanded');
            }

            currentYaoStep++;
            const targetYao = document.getElementById(`yao-${currentYaoStep}`);
            
            const rand = Math.random();
            if (rand < 0.25) {
                targetYao.className = "inner-yao visible-flash";
                statusBar.textContent = `第 ${currentYaoStep} 爻生成：捕捉到變爻閃爍！`;
            } else if (rand < 0.6) {
                targetYao.className = "inner-yao visible-dashed";
                statusBar.textContent = `第 ${currentYaoStep} 爻生成：虛線建立。`;
            } else {
                targetYao.className = "inner-yao visible-solid";
                statusBar.textContent = `第 ${currentYaoStep} 爻生成：實線鎖定。`;
            }

            if (currentYaoStep < totalYaos) {
                tossBtn.textContent = `擲爻 (${currentYaoStep + 1}/6)`;
            } else {
                tossBtn.textContent = `完成`;
                statusBar.textContent = "六爻結構建構完成。";
            }
        }

        tossBtn.addEventListener('click', performToss);
        taijiCore.addEventListener('click', (e) => {
            if (e.target.closest('.bagua-item')) return;
            performToss();
        });

        resetBtn.addEventListener('click', () => {
            currentYaoStep = 0;
            taijiCore.classList.remove('expanded');
            tossBtn.textContent = "擲爻 (1/6)";
            statusBar.textContent = "系統已重置，請重新點擊太極擲爻。";
            
            for (let i = 1; i <= totalYaos; i++) {
                const yao = document.getElementById(`yao-${i}`);
                yao.className = "inner-yao";
            }
        });

        const baguaItems = document.querySelectorAll('.bagua-item');
        baguaItems.forEach(item => {
            item.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('text/plain', item.dataset.gua);
            });
        });

        taijiCore.addEventListener('dragover', (e) => e.preventDefault());
        taijiCore.addEventListener('drop', (e) => {
            e.preventDefault();
            const guaName = e.dataTransfer.getData('text/plain');
            if (currentYaoStep < 6) {
                statusBar.textContent = `請先完成六次擲爻，目前進度 (${currentYaoStep}/6)`;
                return;
            }
            statusBar.textContent = `成功將 [ ${guaName}卦 ] 填入核心區域！`;
            taijiCore.style.borderColor = '#ffb700';
            setTimeout(() => {
                taijiCore.style.borderColor = 'var(--neon-red)';
            }, 1000);
        });
    </script>
</body>
</html>
