<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber I-Ching 賽博易經占卜儀</title>
    <style>
        :root {
            --bg-color: #050508;
            --neon-cyan: #00f3ff;
            --neon-amber: #ffb700;
            --neon-pink: #ff0055;
            --glass-bg: rgba(10, 15, 30, 0.7);
            --border-color: rgba(0, 243, 255, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: #e0e6ed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 243, 255, 0.05) 0%, transparent 70%),
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
        }

        header {
            position: absolute;
            top: 20px;
            text-align: center;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        header h1 {
            font-size: 1.2rem;
            color: var(--neon-cyan);
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
        }

        header p {
            font-size: 0.7rem;
            color: #6c757d;
            margin-top: 4px;
        }

        .main-container {
            position: relative;
            width: 360px;
            height: 360px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 40px 0;
        }

        /* 中央太極核心 */
        .taiji-core {
            position: absolute;
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: var(--glass-bg);
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.3), inset 0 0 15px rgba(0, 243, 255, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            transition: all 0.3s ease;
        }

        .taiji-core:hover {
            box-shadow: 0 0 30px var(--neon-cyan), inset 0 0 20px var(--neon-cyan);
            transform: scale(1.05);
        }

        .taiji-symbol {
            font-size: 1.8rem;
            color: var(--neon-cyan);
            animation: pulse-glow 3s infinite alternate;
        }

        .core-text {
            font-size: 0.65rem;
            letter-spacing: 2px;
            color: var(--neon-cyan);
            margin-top: 4px;
        }

        /* 外環八卦導航圈 */
        .bagua-ring {
            position: absolute;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            border: 1px dashed var(--border-color);
            animation: rotate-ring 120s linear infinite;
        }

        .bagua-item {
            position: absolute;
            width: 48px;
            height: 48px;
            background: var(--glass-bg);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: grab;
            transition: all 0.2s;
            user-select: none;
        }

        .bagua-item:hover {
            border-color: var(--neon-cyan);
            background: rgba(0, 243, 255, 0.15);
            box-shadow: 0 0 10px var(--neon-cyan);
            transform: scale(1.1);
        }

        .bagua-item:active {
            cursor: grabbing;
        }

        .bagua-item .symbol {
            font-size: 1rem;
            font-weight: bold;
            color: #fff;
        }

        .bagua-item .name {
            font-size: 0.5rem;
            color: var(--neon-cyan);
        }

        /* 八卦方位座標定位 (後天八卦基準) */
        .pos-0 { top: 5px; left: 136px; }   /* 離 (南) */
        .pos-1 { top: 46px; left: 226px; }  /* 坤/巽 調整 */
        .pos-2 { top: 136px; left: 267px; } /* 兌 (西) */
        .pos-3 { top: 226px; left: 226px; } 
        .pos-4 { top: 267px; left: 136px; } /* 坎 (北) */
        .pos-5 { top: 226px; left: 46px; }  
        .pos-6 { top: 136px; left: 5px; }   /* 震 (東) */
        .pos-7 { top: 46px; left: 46px; }   

        /* 爻卦結構預覽區 (右側面板) */
        .hexagram-display {
            position: absolute;
            right: -130px;
            top: 50%;
            transform: translateY(-50%);
            width: 100px;
            display: flex;
            flex-direction: column-reverse;
            gap: 6px;
            padding: 10px;
            background: var(--glass-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
        }

        .yao-line {
            height: 6px;
            width: 100%;
            border: 1px dashed rgba(0, 243, 255, 0.4);
            border-radius: 2px;
            transition: all 0.3s;
        }

        .yao-line.active-solid {
            border: none;
            background: var(--neon-cyan);
            box-shadow: 0 0 8px var(--neon-cyan);
        }

        .yao-line.active-dashed {
            border: 1px solid var(--neon-amber);
            background: rgba(255, 183, 0, 0.2);
            box-shadow: 0 0 8px var(--neon-amber);
            animation: flash 1s infinite alternate;
        }

        /* 互動控制台 */
        .control-panel {
            margin-top: 20px;
            display: flex;
            gap: 12px;
        }

        .cyber-btn {
            background: transparent;
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 8px 16px;
            font-size: 0.75rem;
            letter-spacing: 2px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s;
            box-shadow: inset 0 0 5px rgba(0, 243, 255, 0.2);
        }

        .cyber-btn:hover {
            background: var(--neon-cyan);
            color: var(--bg-color);
            box-shadow: 0 0 15px var(--neon-cyan);
        }

        .status-bar {
            margin-top: 15px;
            font-size: 0.7rem;
            color: var(--neon-amber);
            letter-spacing: 1px;
            height: 20px;
            text-align: center;
        }

        @keyframes pulse-glow {
            0% { text-shadow: 0 0 5px var(--neon-cyan); }
            100% { text-shadow: 0 0 15px var(--neon-cyan), 0 0 25px var(--neon-cyan); }
        }

        @keyframes flash {
            0% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        @keyframes rotate-ring {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <header>
        <h1>Cyber I-Ching v0.1</h1>
        <p>後天八卦動態運算控制台</p>
    </header>

    <div class="main-container">
        <!-- 外環八卦 (後天方位) -->
        <div class="bagua-ring" id="baguaRing">
            <div class="bagua-item pos-0" draggable="true" data-卦="離">
                <span class="symbol">☲</span>
                <span class="name">離</span>
            </div>
            <div class="bagua-item pos-1" draggable="true" data-卦="坤">
                <span class="symbol">☷</span>
                <span class="name">坤</span>
            </div>
            <div class="bagua-item pos-2" draggable="true" data-卦="兌">
                <span class="symbol">☱</span>
                <span class="name">兌</span>
            </div>
            <div class="bagua-item pos-3" draggable="true" data-卦="乾">
                <span class="symbol">☰</span>
                <span class="name">乾</span>
            </div>
            <div class="bagua-item pos-4" draggable="true" data-卦="坎">
                <span class="symbol">☵</span>
                <span class="name">坎</span>
            </div>
            <div class="bagua-item pos-5" draggable="true" data-卦="巽">
                <span class="symbol">☴</span>
                <span class="name">巽</span>
            </div>
            <div class="bagua-item pos-6" draggable="true" data-卦="震">
                <span class="symbol">☳</span>
                <span class="name">震</span>
            </div>
            <div class="bagua-item pos-7" draggable="true" data-卦="艮">
                <span class="symbol">☶</span>
                <span class="name">艮</span>
            </div>
        </div>

        <!-- 中央太極核心 -->
        <div class="taiji-core" id="taijiCore" title="點擊進行數據擲爻起卦">
            <div class="taiji-symbol">☯</div>
            <div class="core-text">核心</div>
        </div>

        <!-- 側邊爻卦骨架實時掃描區 -->
        <div class="hexagram-display" id="hexagramDisplay" title="六爻生成進度">
            <div class="yao-line" id="yao-6"></div>
            <div class="yao-line" id="yao-5"></div>
            <div class="yao-line" id="yao-4"></div>
            <div class="yao-line" id="yao-3"></div>
            <div class="yao-line" id="yao-2"></div>
            <div class="yao-line" id="yao-1"></div>
        </div>
    </div>

    <div class="status-bar" id="statusBar">系統就緒：請點擊太極核心開始光子擲爻，或拖曳八卦入核心</div>

    <div class="control-panel">
        <button class="cyber-btn" id="tossBtn">光子擲爻 (1/6)</button>
        <button class="cyber-btn" id="resetBtn">重置系統</button>
    </div>

    <script>
        let currentYaoStep = 0;
        const totalYaos = 6;
        const tossBtn = document.getElementById('tossBtn');
        const resetBtn = document.getElementById('resetBtn');
        const statusBar = document.getElementById('statusBar');
        const taijiCore = document.getElementById('taijiCore');

        // 模擬點擊擲爻
        tossBtn.addEventListener('click', () => {
            if (currentYaoStep >= totalYaos) {
                statusBar.textContent = "六爻已成，請將卦象滑入核心完成合成。";
                return;
            }

            currentYaoStep++;
            const targetYao = document.getElementById(`yao-${currentYaoStep}`);
            
            // 隨機產生實線/虛線與動爻特效
            const isSolid = Math.random() > 0.5;
            const isMoving = Math.random() < 0.25; // 25% 機率產生閃爍變爻

            if (isMoving) {
                targetYao.className = `yao-line active-dashed`;
                statusBar.textContent = `第 ${currentYaoStep} 爻生成：動爻閃爍捕捉中...`;
            } else {
                targetYao.className = `yao-line active-solid`;
                statusBar.textContent = `第 ${currentYaoStep} 爻數據鎖定完成。`;
            }

            if (currentYaoStep < totalYaos) {
                tossBtn.textContent = `光子擲爻 (${currentYaoStep + 1}/6)`;
            } else {
                tossBtn.textContent = `擲爻完畢`;
                statusBar.textContent = "六爻結構建構完畢，請進行後續卦象對位。";
            }
        });

        // 重置系統
        resetBtn.addEventListener('click', () => {
            currentYaoStep = 0;
            tossBtn.textContent = `光子擲爻 (1/6)`;
            statusBar.textContent = "系統已重置，請重新擲爻或操縱八卦。";
            for (let i = 1; i <= totalYaos; i++) {
                document.getElementById(`yao-${i}`).className = `yao-line`;
            }
        });

        // 簡單的拖曳互動提示 (模擬滑入太極)
        const baguaItems = document.querySelectorAll('.bagua-item');
        baguaItems.forEach(item => {
            item.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('text/plain', item.dataset.卦);
            });
        });

        taijiCore.addEventListener('dragover', (e) => {
            e.preventDefault();
        });

        taijiCore.addEventListener('drop', (e) => {
            e.preventDefault();
            const guaName = e.dataTransfer.getData('text/plain');
            statusBar.textContent = `成功將 [ ${guaName}卦 ] 注入太極核心！`;
            taijiCore.style.borderColor = 'var(--neon-amber)';
            setTimeout(() => {
                taijiCore.style.borderColor = 'var(--neon-cyan)';
            }, 1000);
        });

        // 點擊太極也可以直接觸發擲爻
        taijiCore.addEventListener('click', () => {
            tossBtn.click();
        });
    </script>
</body>
</html>
