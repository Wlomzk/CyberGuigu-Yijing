<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber I-Ching 賽博易經占卜儀 v0.3</title>
    <style>
        :root {
            --bg-color: #050508;
            --neon-cyan: #00f3ff;
            --neon-amber: #ffb700;
            --glass-bg: rgba(10, 15, 30, 0.85);
            --border-color: rgba(0, 243, 255, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: #e0e6ed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 243, 255, 0.05) 0%, transparent 70%),
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
        }

        header {
            position: absolute;
            top: 20px;
            text-align: center;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        header h1 {
            font-size: 1.2rem;
            color: var(--neon-cyan);
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
        }

        header p {
            font-size: 0.7rem;
            color: #6c757d;
            margin-top: 4px;
        }

        .main-container {
            position: relative;
            width: 480px;
            height: 480px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 40px 0;
        }

        /* 中央太極核心 (初始狀態) */
        .taiji-core {
            position: absolute;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: #000;
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            overflow: hidden;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 太極 SVG 內部樣式 */
        .taiji-svg {
            width: 100%;
            height: 100%;
            transition: transform 0.6s ease;
        }

        /* 展開狀態：依據手稿，太極左右裂開並向外滑動，中間空出區域容納爻 */
        .taiji-core.expanded {
            width: 320px;
            height: 160px;
            border-radius: 20px;
            background: rgba(5, 10, 20, 0.95);
            border-color: var(--neon-cyan);
            box-shadow: 0 0 35px rgba(0, 243, 255, 0.4);
            justify-content: space-between;
            padding: 10px 20px;
        }

        /* 展開後，左右兩半太極各自帶有黑白區塊與小圓點 */
        .taiji-left, .taiji-right {
            display: none;
            align-items: center;
            justify-content: center;
            width: 70px;
            height: 120px;
        }

        .taiji-core.expanded .taiji-left,
        .taiji-core.expanded .taiji-right {
            display: flex;
        }

        .taiji-core:not(.expanded) .default-taiji-inner {
            display: block;
            width: 100%;
            height: 100%;
        }

        .taiji-core.expanded .default-taiji-inner {
            display: none;
        }

        /* 核心內部的爻卦顯示區 (預設隱藏，展開後顯示在中央) */
        .inner-hexagram {
            display: none;
            flex-direction: column-reverse;
            gap: 6px;
            width: 110px;
        }

        .taiji-core.expanded .inner-hexagram {
            display: flex;
        }

        .inner-yao {
            height: 5px;
            width: 100%;
            opacity: 0;
            border-radius: 2px;
            transition: opacity 0.3s ease;
        }

        .inner-yao.visible-dashed {
            opacity: 1;
            border: 1px dashed rgba(0, 243, 255, 0.6);
            background: transparent;
        }

        .inner-yao.visible-solid {
            opacity: 1;
            border: none;
            background: var(--neon-cyan);
            box-shadow: 0 0 6px var(--neon-cyan);
        }

        .inner-yao.visible-flash {
            opacity: 1;
            border: 1px dashed var(--neon-amber);
            background: rgba(255, 183, 0, 0.3);
            box-shadow: 0 0 8px var(--neon-amber);
            animation: flash 0.8s infinite alternate;
        }

        /* 外環八卦導航圈：改為有稜有角、向中心太極縮小的梯形區塊 */
        .bagua-ring {
            position: absolute;
            width: 440px;
            height: 440px;
            border-radius: 50%;
            pointer-events: none;
        }

        .bagua-item {
            position: absolute;
            width: 75px;
            height: 55px;
            background: var(--glass-bg);
            /* 使用 CSS clip-path 做出向內縮小的梯形外觀，有稜有角 */
            clip-path: polygon(15% 0%, 85% 0%, 100% 100%, 0% 100%);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: grab;
            pointer-events: auto;
            transition: all 0.2s;
            user-select: none;
        }

        .bagua-item:hover {
            border-color: var(--neon-cyan);
            background: rgba(0, 243, 255, 0.2);
            box-shadow: 0 0 12px var(--neon-cyan);
            transform: scale(1.05);
        }

        .bagua-item .symbol {
            font-size: 1.1rem;
            font-weight: bold;
            color: #fff;
            line-height: 1;
        }

        .bagua-item .name {
            font-size: 0.55rem;
            color: var(--neon-cyan);
            margin-top: 2px;
        }

        /* 梯形方位精確定位 (配合手稿位置，讓梯形頂部朝向中心) */
        /* 離 (南 - 上) */
        .pos-li { top: 10px; left: 182px; transform: rotate(180deg); }
        .pos-li > * { transform: rotate(180deg); } /* 文字倒回來 */

        /* 坤 (西南) */
        .pos-kun { top: 75px; left: 310px; transform: rotate(225deg); }
        .pos-kun > * { transform: rotate(-225deg); }

        /* 兌 (西 - 右) */
        .pos-dui { top: 192px; left: 365px; transform: rotate(270deg); }
        .pos-dui > * { transform: rotate(-270deg); }

        /* 乾 (西北) */
        .pos-qian { top: 310px; left: 310px; transform: rotate(315deg); }
        .pos-qian > * { transform: rotate(-315deg); }

        /* 坎 (北 - 下) */
        .pos-kan { top: 375px; left: 182px; transform: rotate(0deg); }

        /* 艮 (東北) */
        .pos-gen { top: 310px; left: 55px; transform: rotate(45deg); }
        .pos-gen > * { transform: rotate(-45deg); }

        /* 震 (東 - 左) */
        .pos-zhen { top: 192px; left: 0px; transform: rotate(90deg); }
        .pos-zhen > * { transform: rotate(-90deg); }

        /* 巽 (東南) */
        .pos-xun { top: 75px; left: 55px; transform: rotate(135deg); }
        .pos-xun > * { transform: rotate(-135deg); }

        /* 互動控制台 */
        .control-panel {
            margin-top: 15px;
            display: flex;
            gap: 12px;
        }

        .cyber-btn {
            background: transparent;
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 8px 16px;
            font-size: 0.75rem;
            letter-spacing: 2px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s;
            box-shadow: inset 0 0 5px rgba(0, 243, 255, 0.2);
        }

        .cyber-btn:hover {
            background: var(--neon-cyan);
            color: var(--bg-color);
            box-shadow: 0 0 15px var(--neon-cyan);
        }

        .status-bar {
            margin-top: 12px;
            font-size: 0.7rem;
            color: var(--neon-amber);
            letter-spacing: 1px;
            height: 20px;
            text-align: center;
        }

        @keyframes flash {
            0% { opacity: 0.3; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Cyber I-Ching v0.3</h1>
        <p>梯形陣列與太極左右裂開展開機制</p>
    </header>

    <div class="main-container">
        <!-- 外環八卦 (梯形外型，固定不旋轉) -->
        <div class="bagua-ring" id="baguaRing">
            <div class="bagua-item pos-li" draggable="true" data-gua="離"><span class="symbol">☲</span><span class="name">離</span></div>
            <div class="bagua-item pos-kun" draggable="true" data-gua="坤"><span class="symbol">☷</span><span class="name">坤</span></div>
            <div class="bagua-item pos-dui" draggable="true" data-gua="兌"><span class="symbol">☱</span><span class="name">兌</span></div>
            <div class="bagua-item pos-qian" draggable="true" data-gua="乾"><span class="symbol">☰</span><span class="name">乾</span></div>
            <div class="bagua-item pos-kan" draggable="true" data-gua="坎"><span class="symbol">☵</span><span class="name">坎</span></div>
            <div class="bagua-item pos-gen" draggable="true" data-gua="艮"><span class="symbol">☶</span><span class="name">艮</span></div>
            <div class="bagua-item pos-zhen" draggable="true" data-gua="震"><span class="symbol">☳</span><span class="name">震</span></div>
            <div class="bagua-item pos-xun" draggable="true" data-gua="巽"><span class="symbol">☴</span><span class="name">巽</span></div>
        </div>

        <!-- 中央太極核心 (依據手稿：點擊後左右裂開，中間顯示逐層爻) -->
        <div class="taiji-core" id="taijiCore" title="點擊太極進行擲爻">
            <!-- 未展開時的完整太極 SVG (精確對應黑色區塊與小圓點) -->
            <div class="default-taiji-inner">
                <svg class="taiji-svg" viewBox="0 0 100 100">
                    <!-- 外框環 -->
                    <circle cx="50" cy="50" r="48" fill="none" stroke="#00f3ff" stroke-width="2"/>
                    <!-- 陰陽魚外輪廓 -->
                    <path d="M50,2 A48,48 0 0,1 50,98 A24,24 0 0,1 50,50 A24,24 0 0,0 50,2 Z" fill="#00f3ff"/>
                    <!-- 左側黑色大區塊與陰影細節 -->
                    <path d="M50,98 A48,48 0 0,1 50,2 A24,24 0 0,1 50,50 A24,24 0 0,0 50,98 Z" fill="#050508"/>
                    <!-- 陽中陰 (上方小白點在黑魚中) -->
                    <circle cx="50" cy="26" r="5" fill="#00f3ff"/>
                    <!-- 陰中陽 (下方小黑點在白魚中) -->
                    <circle cx="50" cy="74" r="5" fill="#050508"/>
                </svg>
            </div>

            <!-- 展開後的左半邊太極 (帶黑底與小白點) -->
            <div class="taiji-left">
                <svg width="45" height="110" viewBox="0 0 45 100">
                    <path d="M45,2 A48,48 0 0,0 45,98 A24,24 0 0,0 45,50 A24,24 0 0,1 45,2 Z" fill="#050508" stroke="#00f3ff" stroke-width="2"/>
                    <circle cx="40" cy="26" r="4" fill="#00f3ff"/>
                </svg>
            </div>

            <!-- 中央爻卦生成區 (隱藏無邊框虛線，依序向上疊加) -->
            <div class="inner-hexagram" id="innerHexagram">
                <div class="inner-yao" id="yao-6"></div>
                <div class="inner-yao" id="yao-5"></div>
                <div class="inner-yao" id="yao-4"></div>
                <div class="inner-yao" id="yao-3"></div>
                <div class="inner-yao" id="yao-2"></div>
                <div class="inner-yao" id="yao-1"></div>
            </div>

            <!-- 展開後的右半邊太極 (帶青色亮底與小黑點) -->
            <div class="taiji-right">
                <svg width="45" height="110" viewBox="0 0 45 100">
                    <path d="M0,98 A48,48 0 0,0 0,2 A24,24 0 0,0 0,50 A24,24 0 0,1 0,98 Z" fill="#00f3ff" stroke="#00f3ff" stroke-width="2"/>
                    <circle cx="5" cy="74" r="4" fill="#050508"/>
                </svg>
            </div>
        </div>
    </div>

    <div class="status-bar" id="statusBar">系統就緒：請點擊中央太極核心開始擲初爻</div>

    <div class="control-panel">
        <button class="cyber-btn" id="tossBtn">擲爻 (1/6)</button>
        <button class="cyber-btn" id="resetBtn">重置</button>
    </div>

    <script>
        let currentYaoStep = 0;
        const totalYaos = 6;
        const taijiCore = document.getElementById('taijiCore');
        const tossBtn = document.getElementById('tossBtn');
        const resetBtn = document.getElementById('resetBtn');
        const statusBar = document.getElementById('statusBar');

        function performToss() {
            if (currentYaoStep >= totalYaos) {
                statusBar.textContent = "六爻已全數擲畢，請拖曳外圈梯形卦象填滿區域。";
                return;
            }

            // 擲第一爻時，太極向左右裂開展開
            if (currentYaoStep === 0) {
                taijiCore.classList.add('expanded');
            }

            currentYaoStep++;
            const targetYao = document.getElementById(`yao-${currentYaoStep}`);
            
            // 隨機產生：實線、無邊框虛線、或閃爍變爻
            const rand = Math.random();
            if (rand < 0.25) {
                targetYao.className = "inner-yao visible-flash";
                statusBar.textContent = `第 ${currentYaoStep} 爻生成：捕捉到變爻閃爍！`;
            } else if (rand < 0.6) {
                targetYao.className = "inner-yao visible-dashed";
                statusBar.textContent = `第 ${currentYaoStep} 爻生成：虛線建立。`;
            } else {
                targetYao.className = "inner-yao visible-solid";
                statusBar.textContent = `第 ${currentYaoStep} 爻生成：實線鎖定。`;
            }

            if (currentYaoStep < totalYaos) {
                tossBtn.textContent = `擲爻 (${currentYaoStep + 1}/6)`;
            } else {
                tossBtn.textContent = `完成`;
                statusBar.textContent = "六爻結構建構完成。";
            }
        }

        tossBtn.addEventListener('click', performToss);
        taijiCore.addEventListener('click', (e) => {
            if (e.target.closest('.bagua-item')) return;
            performToss();
        });

        resetBtn.addEventListener('click', () => {
            currentYaoStep = 0;
            taijiCore.classList.remove('expanded');
            tossBtn.textContent = "擲爻 (1/6)";
            statusBar.textContent = "系統已重置，請重新點擊太極擲爻。";
            
            for (let i = 1; i <= totalYaos; i++) {
                const yao = document.getElementById(`yao-${i}`);
                yao.className = "inner-yao";
            }
        });

        // 拖曳互動
        const baguaItems = document.querySelectorAll('.bagua-item');
        baguaItems.forEach(item => {
            item.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('text/plain', item.dataset.gua);
            });
        });

        taijiCore.addEventListener('dragover', (e) => e.preventDefault());
        taijiCore.addEventListener('drop', (e) => {
            e.preventDefault();
            const guaName = e.dataTransfer.getData('text/plain');
            if (currentYaoStep < 6) {
                statusBar.textContent = `請先完成六次擲爻，目前進度 (${currentYaoStep}/6)`;
                return;
            }
            statusBar.textContent = `成功將 [ ${guaName}卦 ] 填入核心區域！`;
            taijiCore.style.borderColor = 'var(--neon-amber)';
            setTimeout(() => {
                taijiCore.style.borderColor = 'var(--neon-cyan)';
            }, 1000);
        });
    </script>
</body>
</html>
