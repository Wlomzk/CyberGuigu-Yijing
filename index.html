<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber I-Ching 賽博易經占卜儀 v6.3 完美版</title>
    <style>
        :root {
            --bg-color: #050507;
            --neon-red: #ff3333;
            --neon-amber: #ffb700;
            --panel-bg: rgba(15, 8, 8, 0.95);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: #e0e6ed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(255, 51, 51, 0.03) 0%, transparent 70%),
                linear-gradient(rgba(255, 51, 51, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 51, 51, 0.015) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
        }

        header {
            position: absolute;
            top: 20px;
            text-align: center;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        header h1 {
            font-size: 1rem;
            color: var(--neon-red);
            text-shadow: 0 0 10px rgba(255, 51, 51, 0.4);
        }

        header p {
            font-size: 0.6rem;
            color: #888;
            margin-top: 3px;
        }

        .stage-container {
            position: relative;
            width: 500px;
            height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 外圍八卦梯形環繞區塊：寬度改為 3 倍 (126px)，內窄外寬，緊貼太極外圍 */
        .trapezoid-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .trap-block {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 126px; /* 寬度放大 3 倍 */
            height: 48px;
            background: var(--panel-bg);
            border: 1px solid rgba(255, 51, 51, 0.4);
            /* 修正寬窄邊：上窄下寬（內窄外寬），拼起來呈現完美的放射環繞 */
            clip-path: polygon(25% 0%, 75% 0%, 100% 100%, 0% 100%);
            transform-origin: 50% 100px; /* 半徑對齊中央太極外緣 */
            pointer-events: auto;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .trap-block:hover {
            border-color: var(--neon-red);
            background: rgba(255, 51, 51, 0.15);
            box-shadow: 0 0 10px var(--neon-red);
        }

        .trap-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.75rem;
            color: var(--neon-red);
        }

        /* 8個方向精準環繞半徑 (-100px 貼合直徑 120px 的太極) */
        .trap-1 { transform: translate(-50%, -50%) rotate(0deg) translateY(-100px); }
        .trap-1 .trap-content { transform: rotate(0deg); }

        .trap-2 { transform: translate(-50%, -50%) rotate(45deg) translateY(-100px); }
        .trap-2 .trap-content { transform: rotate(-45deg); }

        .trap-3 { transform: translate(-50%, -50%) rotate(90deg) translateY(-100px); }
        .trap-3 .trap-content { transform: rotate(-90deg); }

        .trap-4 { transform: translate(-50%, -50%) rotate(135deg) translateY(-100px); }
        .trap-4 .trap-content { transform: rotate(-135deg); }

        .trap-5 { transform: translate(-50%, -50%) rotate(180deg) translateY(-100px); }
        .trap-5 .trap-content { transform: rotate(-180deg); }

        .trap-6 { transform: translate(-50%, -50%) rotate(225deg) translateY(-100px); }
        .trap-6 .trap-content { transform: rotate(-225deg); }

        .trap-7 { transform: translate(-50%, -50%) rotate(270deg) translateY(-100px); }
        .trap-7 .trap-content { transform: rotate(-270deg); }

        .trap-8 { transform: translate(-50%, -50%) rotate(315deg) translateY(-100px); }
        .trap-8 .trap-content { transform: rotate(-315deg); }


        /* 中央互動核心 */
        .core-area {
            position: absolute;
            width: 140px;
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
        }

        /* 雙獨立太極魚對組 */
        .taijitu-pair {
            position: absolute;
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .fish-left, .fish-right {
            position: absolute;
            width: 60px;
            height: 120px;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .fish-left { left: 0; }
        .fish-right { right: 0; }

        /* 點擊後：中央太極展開並消失 */
        .core-area.active .taijitu-pair {
            opacity: 0;
            transform: scale(1.5);
            pointer-events: none;
        }

        .core-area.active .fish-left {
            transform: translateX(-60px);
        }

        .core-area.active .fish-right {
            transform: translateX(60px);
        }

        /* 中間爻卦區：由下往上堆疊 */
        .hexagram-slot {
            position: absolute;
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 90px;
            padding: 10px;
            opacity: 0;
            transform: scale(0.9);
            transition: all 0.5s ease;
            pointer-events: none;
        }

        .core-area.active .hexagram-slot {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        #yao-6 { order: 1; }
        #yao-5 { order: 2; }
        #yao-4 { order: 3; }
        #yao-3 { order: 4; }
        #yao-2 { order: 5; }
        #yao-1 { order: 6; }

        .yao-line {
            height: 6px;
            width: 100%;
            opacity: 0;
            border-radius: 2px;
            transition: opacity 0.3s ease;
        }

        .yao-line.dashed {
            opacity: 1;
            border: 1px dashed rgba(255, 51, 51, 0.8);
            background: transparent;
        }

        .yao-line.solid {
            opacity: 1;
            border: none;
            background: var(--neon-red);
            box-shadow: 0 0 6px var(--neon-red);
        }

        .yao-line.flash {
            opacity: 1;
            border: 1px dashed var(--neon-amber);
            background: rgba(255, 183, 0, 0.3);
            box-shadow: 0 0 8px var(--neon-amber);
            animation: flash-anim 0.8s infinite alternate;
        }

        .control-panel {
            margin-top: 15px;
            display: flex;
            gap: 15px;
        }

        .cyber-btn {
            background: transparent;
            border: 1px solid var(--neon-red);
            color: var(--neon-red);
            padding: 8px 18px;
            font-size: 0.7rem;
            letter-spacing: 2px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s;
            box-shadow: inset 0 0 5px rgba(255, 51, 51, 0.2);
        }

        .cyber-btn:hover {
            background: var(--neon-red);
            color: #000;
            box-shadow: 0 0 15px var(--neon-red);
        }

        .status-msg {
            margin-top: 10px;
            font-size: 0.7rem;
            color: var(--neon-amber);
            letter-spacing: 1px;
            height: 20px;
            text-align: center;
        }

        @keyframes flash-anim {
            0% { opacity: 0.3; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Cyber I-Ching v6.3</h1>
        <p>外圍八卦梯形寬度 3 倍 ＋ 內窄外寬 ＋ 緊密環繞太極</p>
    </header>

    <div class="stage-container">
        <!-- 外圍八卦梯形環繞區塊 -->
        <div class="trapezoid-ring">
            <div class="trap-block trap-1"><div class="trap-content"><span>☰</span><span>乾</span></div></div>
            <div class="trap-block trap-2"><div class="trap-content"><span>☱</span><span>兌</span></div></div>
            <div class="trap-block trap-3"><div class="trap-content"><span>☲</span><span>離</span></div></div>
            <div class="trap-block trap-4"><div class="trap-content"><span>☳</span><span>震</span></div></div>
            <div class="trap-block trap-5"><div class="trap-content"><span>☴</span><span>巽</span></div></div>
            <div class="trap-block trap-6"><div class="trap-content"><span>☵</span><span>坎</span></div></div>
            <div class="trap-block trap-7"><div class="trap-content"><span>☶</span><span>艮</span></div></div>
            <div class="trap-block trap-8"><div class="trap-content"><span>☷</span><span>坤</span></div></div>
        </div>

        <!-- 中央互動核心 -->
        <div class="core-area" id="coreArea" title="點擊進行擲爻">
            <div class="taijitu-pair">
                <div class="fish-left">
                    <svg width="100%" height="100%" viewBox="0 0 60 120">
                        <path d="M60,0 C26.86,0 0,26.86 0,60 C0,93.14 26.86,120 60,120 C44.54,120 30,105.46 30,90 C30,74.54 44.54,60 60,60 C44.54,60 30,45.46 30,30 C30,14.54 44.54,0 60,0 Z" fill="#000000"/>
                        <circle cx="44" cy="30" r="5" fill="#ffffff"/>
                    </svg>
                </div>
                <div class="fish-right">
                    <svg width="100%" height="100%" viewBox="0 0 60 120">
                        <path d="M0,120 C33.14,120 60,93.14 60,60 C60,26.86 33.14,0 0,0 C15.46,0 30,14.54 30,30 C30,45.46 15.46,60 0,60 C15.46,60 30,74.54 30,90 C30,105.46 15.46,120 0,120 Z" fill="#ffffff"/>
                        <circle cx="16" cy="90" r="5" fill="#000000"/>
                    </svg>
                </div>
            </div>

            <div class="hexagram-slot">
                <div class="yao-line" id="yao-6"></div>
                <div class="yao-line" id="yao-5"></div>
                <div class="yao-line" id="yao-4"></div>
                <div class="yao-line" id="yao-3"></div>
                <div class="yao-line" id="yao-2"></div>
                <div class="yao-line" id="yao-1"></div>
            </div>
        </div>
    </div>

    <div class="status-msg" id="statusMsg">系統就緒：點擊中央太極開始由下往上擲初爻</div>

    <div class="control-panel">
        <button class="cyber-btn" id="tossBtn">擲爻 (1/6)</button>
        <button class="cyber-btn" id="resetBtn">重置</button>
    </div>

    <script>
        let step = 0;
        const maxStep = 6;
        const coreArea = document.getElementById('coreArea');
        const tossBtn = document.getElementById('tossBtn');
        const resetBtn = document.getElementById('resetBtn');
        const statusMsg = document.getElementById('statusMsg');

        function executeToss() {
            if (step >= maxStep) {
                statusMsg.textContent = "六爻已全數擲畢。";
                return;
            }

            if (step === 0) {
                coreArea.classList.add('active'); // 觸發中央太極展開並消失
            }

            step++;
            const currentYao = document.getElementById(`yao-${step}`);
            const dice = Math.random();

            if (dice < 0.25) {
                currentYao.className = "yao-line flash";
                statusMsg.textContent = `第 ${step} 爻（初爻起算）生成：捕捉到變爻閃爍！`;
            } else if (dice < 0.6) {
                currentYao.className = "yao-line dashed";
                statusMsg.textContent = `第 ${step} 爻（初爻起算）生成：虛線建立。`;
            } else {
                currentYao.className = "yao-line solid";
                statusMsg.textContent = `第 ${step} 爻（初爻起算）生成：實線鎖定。`;
            }

            if (step < maxStep) {
                tossBtn.textContent = `擲爻 (${step + 1}/6)`;
            } else {
                tossBtn.textContent = `完成`;
                statusMsg.textContent = "六爻結構由下往上建構完成。";
            }
        }

        tossBtn.addEventListener('click', executeToss);
        coreArea.addEventListener('click', (e) => {
            executeToss();
        });

        resetBtn.addEventListener('click', () => {
            step = 0;
            coreArea.classList.remove('active');
            tossBtn.textContent = "擲爻 (1/6)";
            statusMsg.textContent = "系統已重置，請重新點擊中央太極擲爻。";
            
            for (let i = 1; i <= maxStep; i++) {
                document.getElementById(`yao-${i}`).className = "yao-line";
            }
        });
    </script>
</body>
</html>
