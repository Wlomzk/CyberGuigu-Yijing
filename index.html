<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber I-Ching 賽博易經占卜儀</title>
    <style>
        :root {
            --bg-color: #050508;
            --neon-cyan: #00f3ff;
            --neon-amber: #ffb700;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: #e0e6ed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        header {
            position: absolute;
            top: 20px;
            text-align: center;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        header h1 {
            font-size: 1.2rem;
            color: #fff;
        }

        header p {
            font-size: 0.7rem;
            color: #888;
            margin-top: 4px;
        }

        .main-container {
            position: relative;
            width: 420px;
            height: 420px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 40px 0;
        }

        /* 中央太極容器 (點擊可從中間左右分開並漸漸消失) */
        .taiji-container {
            position: absolute;
            width: 140px;
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            transition: transform 0.6s ease;
        }

        /* 左右半邊太極：用來做向左右分開並淡出的動畫 */
        .taiji-half {
            position: absolute;
            width: 70px;
            height: 140px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="%23fff" stroke="%23000" stroke-width="2"/><path d="M50 2a48 48 0 0 1 0 96a24 24 0 0 1 0-48a24 24 0 0 0 0-48z" fill="%23000"/><circle cx="50" cy="26" r="8" fill="%23fff"/><circle cx="50" cy="74" r="8" fill="%23000"/></svg>');
            background-size: 140px 140px;
            transition: all 0.8s ease;
        }

        .taiji-half.left {
            left: 0;
            background-position: left center;
            border-top-left-radius: 70px;
            border-bottom-left-radius: 70px;
        }

        .taiji-half.right {
            right: 0;
            background-position: right center;
            border-top-right-radius: 70px;
            border-bottom-right-radius: 70px;
        }

        /* 展開時：左右分開並漸漸消失 */
        .taiji-container.split .taiji-half.left {
            transform: translateX(-80px);
            opacity: 0;
        }

        .taiji-container.split .taiji-half.right {
            transform: translateX(80px);
            opacity: 0;
        }

        /* 核心內部的爻卦顯示區 (由底至上生成) */
        .inner-hexagram {
            position: absolute;
            display: none;
            flex-direction: column; /* 讓第一爻在底部，往上堆疊 */
            gap: 6px;
            width: 90px;
            z-index: 5;
        }

        .taiji-container.split .inner-hexagram {
            display: flex;
        }

        .inner-yao {
            height: 5px;
            width: 100%;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        /* 無外框、無背景的純線條虛線爻 */
        .inner-yao.visible-dashed {
            opacity: 1;
            border-bottom: 2px dashed #ff0055; /* 紅黑配色的紅 */
        }

        .inner-yao.visible-solid {
            opacity: 1;
            background: #ff0055;
        }

        /* 動爻閃爍特效 */
        .inner-yao.visible-flash {
            opacity: 1;
            border-bottom: 2px dashed var(--neon-amber);
            animation: flash 0.6s infinite alternate;
        }

        /* 外環八卦 (傳統紅黑配色、固定不動) */
        .bagua-ring {
            position: absolute;
            width: 380px;
            height: 380px;
            border-radius: 50%;
            pointer-events: none;
        }

        .bagua-item {
            position: absolute;
            width: 50px;
            height: 50px;
            background: #111;
            border: 1px solid #333;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: grab;
            pointer-events: auto;
            transition: all 0.2s;
            user-select: none;
        }

        .bagua-item:hover {
            border-color: #ff0055;
            box-shadow: 0 0 8px rgba(255, 0, 85, 0.4);
            transform: scale(1.08);
        }

        .bagua-item .symbol {
            font-size: 1rem;
            font-weight: bold;
            color: #ff0055; /* 傳統紅黑配色的紅 */
        }

        .bagua-item .name {
            font-size: 0.5rem;
            color: #ccc;
        }

        /* 後天八卦位置對應手稿 */
        .pos-li { top: 10px; left: 165px; }   /* 離 */
        .pos-kun { top: 60px; left: 285px; }  /* 坤 */
        .pos-dui { top: 165px; left: 335px; } /* 兌 */
        .pos-qian { top: 270px; left: 285px; }/* 乾 */
        .pos-kan { top: 320px; left: 165px; } /* 坎 */
        .pos-gen { top: 270px; left: 45px; }  /* 艮 */
        .pos-zhen { top: 165px; left: 0px; }  /* 震 */
        .pos-xun { top: 60px; left: 45px; }   /* 巽 */

        /* 控制台 */
        .control-panel {
            margin-top: 15px;
            display: flex;
            gap: 12px;
        }

        .cyber-btn {
            background: transparent;
            border: 1px solid #ff0055;
            color: #ff0055;
            padding: 8px 16px;
            font-size: 0.75rem;
            letter-spacing: 2px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s;
        }

        .cyber-btn:hover {
            background: #ff0055;
            color: #fff;
            box-shadow: 0 0 12px rgba(255, 0, 85, 0.6);
        }

        .status-bar {
            margin-top: 12px;
            font-size: 0.7rem;
            color: var(--neon-amber);
            letter-spacing: 1px;
            height: 20px;
            text-align: center;
        }

        @keyframes flash {
            0% { opacity: 0.2; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Cyber I-Ching v0.3</h1>
        <p>依手稿修正：太極左右分開淡出、由下至上生成爻</p>
    </header>

    <div class="main-container">
        <!-- 外環八卦 (傳統紅黑配色) -->
        <div class="bagua-ring">
            <div class="bagua-item pos-li" draggable="true" data-gua="離"><span class="symbol">☲</span><span class="name">離</span></div>
            <div class="bagua-item pos-kun" draggable="true" data-gua="坤"><span class="symbol">☷</span><span class="name">坤</span></div>
            <div class="bagua-item pos-dui" draggable="true" data-gua="兌"><span class="symbol">☱</span><span class="name">兌</span></div>
            <div class="bagua-item pos-qian" draggable="true" data-gua="乾"><span class="symbol">☰</span><span class="name">乾</span></div>
            <div class="bagua-item pos-kan" draggable="true" data-gua="坎"><span class="symbol">☵</span><span class="name">坎</span></div>
            <div class="bagua-item pos-gen" draggable="true" data-gua="艮"><span class="symbol">☶</span><span class="name">艮</span></div>
            <div class="bagua-item pos-zhen" draggable="true" data-gua="震"><span class="symbol">☳</span><span class="name">震</span></div>
            <div class="bagua-item pos-xun" draggable="true" data-gua="巽"><span class="symbol">☴</span><span class="name">巽</span></div>
        </div>

        <!-- 中央太極：點擊可從中間左右分開並漸漸消失 -->
        <div class="taiji-container" id="taijiContainer" title="點擊進行擲爻">
            <div class="taiji-half left"></div>
            <div class="taiji-half right"></div>
            
            <!-- 內部爻卦顯示區：由下至上 (1到6) -->
            <div class="inner-hexagram" id="innerHexagram">
                <div class="inner-yao" id="yao-6"></div>
                <div class="inner-yao" id="yao-5"></div>
                <div class="inner-yao" id="yao-4"></div>
                <div class="inner-yao" id="yao-3"></div>
                <div class="inner-yao" id="yao-2"></div>
                <div class="inner-yao" id="yao-1"></div>
            </div>
        </div>
    </div>

    <div class="status-bar" id="statusBar">請點擊中央太極圖案開始擲初爻</div>

    <div class="control-panel">
        <button class="cyber-btn" id="tossBtn">擲爻 (初爻 1/6)</button>
        <button class="cyber-btn" id="resetBtn">重置</button>
    </div>

    <script>
        let currentYaoStep = 0;
        const totalYaos = 6;
        const taijiContainer = document.getElementById('taijiContainer');
        const tossBtn = document.getElementById('tossBtn');
        const resetBtn = document.getElementById('resetBtn');
        const statusBar = document.getElementById('statusBar');

        function performToss() {
            if (currentYaoStep >= totalYaos) {
                statusBar.textContent = "六爻已全數擲畢，請拖曳外圈卦象填滿區域。";
                return;
            }

            // 擲第一爻時，太極從中間左右分開並漸漸消失
            if (currentYaoStep === 0) {
                taijiContainer.classList.add('split');
            }

            currentYaoStep++;
            // 由於 HTML 結構是視覺上由上到下排布 (yao-6 到 yao-1)，
            // 若要「由下往上」生成，我們依序點亮從 yao-1 到 yao-6
            const targetYao = document.getElementById(`yao-${currentYaoStep}`);
            
            const rand = Math.random();
            if (rand < 0.25) {
                targetYao.className = "inner-yao visible-flash";
                statusBar.textContent = `第 ${currentYaoStep} 爻（由下往上）生成：捕捉到變爻閃爍！`;
            } else if (rand < 0.6) {
                targetYao.className = "inner-yao visible-dashed";
                statusBar.textContent = `第 ${currentYaoStep} 爻（由下往上）生成：虛線建立。`;
            } else {
                targetYao.className = "inner-yao visible-solid";
                statusBar.textContent = `第 ${currentYaoStep} 爻（由下往上）生成：實線鎖定。`;
            }

            if (currentYaoStep < totalYaos) {
                tossBtn.textContent = `擲爻 (${currentYaoStep + 1}/6)`;
            } else {
                tossBtn.textContent = `完成`;
                statusBar.textContent = "六爻結構建構完成。";
            }
        }

        tossBtn.addEventListener('click', performToss);
        taijiContainer.addEventListener('click', (e) => {
            if (e.target.closest('.bagua-item')) return;
            performToss();
        });

        resetBtn.addEventListener('click', () => {
            currentYaoStep = 0;
            taijiContainer.classList.remove('split');
            tossBtn.textContent = "擲爻 (初爻 1/6)";
            statusBar.textContent = "系統已重置，請點擊中央太極圖案開始擲初爻。";
            
            for (let i = 1; i <= totalYaos; i++) {
                document.getElementById(`yao-${i}`).className = "inner-yao";
            }
        });
    </script>
</body>
</html>
