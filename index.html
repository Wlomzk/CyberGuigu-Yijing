你可以直接複製下方這段完整的程式碼覆蓋你的檔案：

HTML


<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber I-Ching 賽博易經占卜儀 v6.0 正式完美版</title>
    <style>
        :root {
            --bg-color: #050507;
            --neon-red: #ff3333;
            --neon-amber: #ffb700;
            --panel-bg: rgba(15, 8, 8, 0.95);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: #e0e6ed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(255, 51, 51, 0.03) 0%, transparent 70%),
                linear-gradient(rgba(255, 51, 51, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 51, 51, 0.015) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
        }

        header {
            position: absolute;
            top: 25px;
            text-align: center;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        header h1 {
            font-size: 1.1rem;
            color: var(--neon-red);
            text-shadow: 0 0 10px rgba(255, 51, 51, 0.4);
        }

        header p {
            font-size: 0.65rem;
            color: #888;
            margin-top: 4px;
        }

        .stage-container {
            position: relative;
            width: 520px;
            height: 520px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 整個外環八卦 SVG 容器 */
        .bagua-ring-svg {
            position: absolute;
            width: 480px;
            height: 480px;
            pointer-events: none;
        }

        .bagua-slice {
            fill: var(--panel-bg);
            stroke: rgba(255, 51, 51, 0.3);
            stroke-width: 1.5;
            cursor: pointer;
            pointer-events: auto;
            transition: all 0.25s ease;
        }

        .bagua-slice:hover {
            fill: rgba(255, 51, 51, 0.15);
            stroke: var(--neon-red);
            filter: drop-shadow(0 0 8px var(--neon-red));
        }

        .bagua-text {
            font-size: 14px;
            fill: #ffcccc;
            font-family: 'Courier New', Courier, monospace;
            text-anchor: middle;
            dominant-baseline: middle;
            pointer-events: none;
        }

        .bagua-name {
            font-size: 10px;
            fill: var(--neon-red);
            font-family: 'Courier New', Courier, monospace;
            text-anchor: middle;
            dominant-baseline: middle;
            pointer-events: none;
        }

        /* 中央互動核心 */
        .core-area {
            position: absolute;
            width: 150px;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
        }

        /* 雙獨立太極魚對組：絕對獨立的兩條魚，各自帶有魚眼 */
        .taijitu-pair {
            position: absolute;
            width: 130px;
            height: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .fish-left, .fish-right {
            position: absolute;
            width: 65px;
            height: 130px;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .fish-left { left: 0; }
        .fish-right { right: 0; }

        /* 點擊後：兩隻獨立太極魚向左右徹底分開並淡出消失 */
        .core-area.active .taijitu-pair {
            opacity: 0;
            transform: scale(0.5);
            pointer-events: none;
        }

        .core-area.active .fish-left {
            transform: translateX(-55px);
        }

        .core-area.active .fish-right {
            transform: translateX(55px);
        }

        /* 中間爻卦區：絕對無邊框，由下往上堆疊 */
        .hexagram-slot {
            position: absolute;
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100px;
            padding: 10px;
            background: transparent;
            opacity: 0;
            transform: scale(0.9);
            transition: all 0.5s ease;
            pointer-events: none;
        }

        .core-area.active .hexagram-slot {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        /* 嚴格規定：#yao-1 在最下方，#yao-6 在最上方 */
        #yao-6 { order: 1; }
        #yao-5 { order: 2; }
        #yao-4 { order: 3; }
        #yao-3 { order: 4; }
        #yao-2 { order: 5; }
        #yao-1 { order: 6; }

        .yao-line {
            height: 6px;
            width: 100%;
            opacity: 0;
            border-radius: 2px;
            transition: opacity 0.3s ease;
        }

        .yao-line.dashed {
            opacity: 1;
            border: 1px dashed rgba(255, 51, 51, 0.8);
            background: transparent;
        }

        .yao-line.solid {
            opacity: 1;
            border: none;
            background: var(--neon-red);
            box-shadow: 0 0 6px var(--neon-red);
        }

        .yao-line.flash {
            opacity: 1;
            border: 1px dashed var(--neon-amber);
            background: rgba(255, 183, 0, 0.3);
            box-shadow: 0 0 8px var(--neon-amber);
            animation: flash-anim 0.8s infinite alternate;
        }

        .control-panel {
            margin-top: 15px;
            display: flex;
            gap: 15px;
        }

        .cyber-btn {
            background: transparent;
            border: 1px solid var(--neon-red);
            color: var(--neon-red);
            padding: 8px 18px;
            font-size: 0.7rem;
            letter-spacing: 2px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s;
            box-shadow: inset 0 0 5px rgba(255, 51, 51, 0.2);
        }

        .cyber-btn:hover {
            background: var(--neon-red);
            color: #000;
            box-shadow: 0 0 15px var(--neon-red);
        }

        .status-msg {
            margin-top: 10px;
            font-size: 0.7rem;
            color: var(--neon-amber);
            letter-spacing: 1px;
            height: 20px;
            text-align: center;
        }

        @keyframes flash-anim {
            0% { opacity: 0.3; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Cyber I-Ching v6.0</h1>
        <p>完美放射狀扇形八卦 ＋ 獨立雙太極魚分離淡出 ＋ 無邊框由下往上爻序</p>
    </header>

    <div class="stage-container">
        <!-- 真正標準的放射狀扇形八卦環 -->
        <svg class="bagua-ring-svg" viewBox="0 0 480 480">
            <g class="bagua-slice-group" draggable="true" data-gua="離">
                <path class="bagua-slice" d="M 211.72,100 A 140,140 0 0,1 268.28,100 L 293.18,22 A 220,220 0 0,0 186.82,22 Z" />
                <text x="240" y="55" class="bagua-text">☲</text>
                <text x="240" y="72" class="bagua-name">離</text>
            </g>
            <g class="bagua-slice-group" draggable="true" data-gua="巽">
                <path class="bagua-slice" d="M 300.00,140 A 140,140 0 0,1 340.00,180 L 415.56,124.44 A 220,220 0 0,0 355.56,64.44 Z" />
                <text x="350" y="98" class="bagua-text">☴</text>
                <text x="365" y="118" class="bagua-name">巽</text>
            </g>
            <g class="bagua-slice-group" draggable="true" data-gua="震">
                <path class="bagua-slice" d="M 340,211.72 A 140,140 0 0,1 340,268.28 L 418,293.18 A 220,220 0 0,0 418,186.82 Z" />
                <text x="390" y="240" class="bagua-text">☳</text>
                <text x="390" y="258" class="bagua-name">震</text>
            </g>
            <g class="bagua-slice-group" draggable="true" data-gua="艮">
                <path class="bagua-slice" d="M 300.00,340 A 140,140 0 0,1 268.28,380 L 355.56,415.56 A 220,220 0 0,0 415.56,355.56 Z" />
                <text x="350" y="382" class="bagua-text">☶</text>
                <text x="365" y="362" class="bagua-name">艮</text>
            </g>
            <g class="bagua-slice-group" draggable="true" data-gua="坤">
                <path class="bagua-slice" d="M 268.28,380 A 140,140 0 0,1 211.72,380 L 186.82,458 A 220,220 0 0,0 293.18,458 Z" />
                <text x="240" y="425" class="bagua-text">☷</text>
                <text x="240" y="408" class="bagua-name">坤</text>
            </g>
            <g class="bagua-slice-group" draggable="true" data-gua="兌">
                <path class="bagua-slice" d="M 140.00,340 A 140,140 0 0,1 100.00,300 L 64.44,355.56 A 220,220 0 0,0 124.44,415.56 Z" />
                <text x="130" y="382" class="bagua-text">☱</text>
                <text x="115" y="362" class="bagua-name">兌</text>
            </g>
            <g class="bagua-slice-group" draggable="true" data-gua="坎">
                <path class="bagua-slice" d="M 100,268.28 A 140,140 0 0,1 100,211.72 L 22,186.82 A 220,220 0 0,0 22,293.18 Z" />
                <text x="90" y="240" class="bagua-text">☵</text>
                <text x="108" y="240" class="bagua-name">坎</text>
            </g>
            <g class="bagua-slice-group" draggable="true" data-gua="乾">
                <path class="bagua-slice" d="M 140.00,140 A 140,140 0 0,1 211.72,100 L 186.82,22 A 220,220 0 0,0 64.44,124.44 Z" />
                <text x="130" y="98" class="bagua-text">☰</text>
                <text x="115" y="118" class="bagua-name">乾</text>
            </g>
        </svg>

        <!-- 中央互動核心 -->
        <div class="core-area" id="coreArea" title="點擊進行擲爻">
            <div class="taijitu-pair">
                <div class="fish-left">
                    <svg width="100%" height="100%" viewBox="0 0 65 130">
                        <path d="M65,0 C29.1,0 0,29.1 0,65 C0,100.9 29.1,130 65,130 C48.4,130 32.5,114.1 32.5,97.5 C32.5,80.9 48.4,65 65,65 C48.4,65 32.5,49.1 32.5,32.5 C32.5,15.9 48.4,0 65,0 Z" fill="#000000"/>
                        <circle cx="48" cy="32.5" r="6" fill="#ffffff"/>
                    </svg>
                </div>
                <div class="fish-right">
                    <svg width="100%" height="100%" viewBox="0 0 65 130">
                        <path d="M0,130 C35.9,130 65,100.9 65,65 C65,29.1 35.9,0 0,0 C16.6,0 32.5,15.9 32.5,32.5 C32.5,49.1 16.6,65 0,65 C16.6,65 32.5,80.9 32.5,97.5 C32.5,114.1 16.6,130 0,130 Z" fill="#ffffff"/>
                        <circle cx="17" cy="97.5" r="6" fill="#000000"/>
                    </svg>
                </div>
            </div>

            <div class="hexagram-slot">
                <div class="yao-line" id="yao-6"></div>
                <div class="yao-line" id="yao-5"></div>
                <div class="yao-line" id="yao-4"></div>
                <div class="yao-line" id="yao-3"></div>
                <div class="yao-line" id="yao-2"></div>
                <div class="yao-line" id="yao-1"></div>
            </div>
        </div>
    </div>

    <div class="status-msg" id="statusMsg">系統就緒：點擊中央獨立雙魚開始由下往上擲初爻</div>

    <div class="control-panel">
        <button class="cyber-btn" id="tossBtn">擲爻 (1/6)</button>
        <button class="cyber-btn" id="resetBtn">重置</button>
    </div>

    <script>
        let step = 0;
        const maxStep = 6;
        const coreArea = document.getElementById('coreArea');
        const tossBtn = document.getElementById('tossBtn');
        const resetBtn = document.getElementById('resetBtn');
        const statusMsg = document.getElementById('statusMsg');

        function executeToss() {
            if (step >= maxStep) {
                statusMsg.textContent = "六爻已全數擲畢。";
                return;
            }

            if (step === 0) {
                coreArea.classList.add('active');
            }

            step++;
            const currentYao = document.getElementById(`yao-${step}`);
            const dice = Math.random();

            if (dice < 0.25) {
                currentYao.className = "yao-line flash";
                statusMsg.textContent = `第 ${step} 爻（初爻起算）生成：捕捉到變爻閃爍！`;
            } else if (dice < 0.6) {
                currentYao.className = "yao-line dashed";
                statusMsg.textContent = `第 ${step} 爻（初爻起算）生成：虛線建立。`;
            } else {
                currentYao.className = "yao-line solid";
                statusMsg.textContent = `第 ${step} 爻（初爻起算）生成：實線鎖定。`;
            }

            if (step < maxStep) {
                tossBtn.textContent = `擲爻 (${step + 1}/6)`;
            } else {
                tossBtn.textContent = `完成`;
                statusMsg.textContent = "六爻結構由下往上建構完成。";
            }
        }

        tossBtn.addEventListener('click', executeToss);
        coreArea.addEventListener('click', (e) => {
            if (e.target.closest('.bagua-slice-group')) return;
            executeToss();
        });

        resetBtn.addEventListener('click', () => {
            step = 0;
            coreArea.classList.remove('active');
            tossBtn.textContent = "擲爻 (1/6)";
            statusMsg.textContent = "系統已重置，請重新點擊太極雙魚擲爻。";
            
            for (let i = 1; i <= maxStep; i++) {
                document.getElementById(`yao-${i}`).className = "yao-line";
            }
        });

        document.querySelectorAll('.bagua-slice-group').forEach(group => {
            group.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('text/plain', group.dataset.gua);
            });
            group.setAttribute('draggable', 'true');
        });

        coreArea.addEventListener('dragover', (e) => e.preventDefault());
        coreArea.addEventListener('drop', (e) => {
            e.preventDefault();
            const gua = e.dataTransfer.getData('text/plain');
            if (step < 6) {
                statusMsg.textContent = `請先完成六次擲爻，目前進度 (${step}/6)`;
                return;
            }
            statusMsg.textContent = `成功將 [ ${gua}卦 ] 鎖入核心區域！`;
        });
    </script>
</body>
</html>
