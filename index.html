<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber I-Ching 賽博易經占卜儀 v1.0 (重構版)</title>
    <style>
        :root {
            --bg-color: #030305;
            --neon-cyan: #00f3ff;
            --neon-amber: #ffb700;
            --panel-bg: rgba(8, 12, 24, 0.95);
            --border-glow: rgba(0, 243, 255, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: #e0e6ed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 243, 255, 0.04) 0%, transparent 70%),
                linear-gradient(rgba(0, 243, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
        }

        header {
            position: absolute;
            top: 25px;
            text-align: center;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        header h1 {
            font-size: 1.1rem;
            color: var(--neon-cyan);
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.4);
        }

        header p {
            font-size: 0.65rem;
            color: #6c757d;
            margin-top: 4px;
        }

        /* 畫布外框 */
        .stage-container {
            position: relative;
            width: 520px;
            height: 520px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 中央互動核心 (未展開時是圓形太極) */
        .core-area {
            position: absolute;
            width: 140px;
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            transition: width 0.5s ease;
        }

        /* 展開後變寬，左右分離，中間留空放爻 */
        .core-area.active {
            width: 380px;
            justify-content: space-between;
        }

        /* 完整太極 */
        .taiji-united {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
            background: #000;
        }

        .core-area.active .taiji-united {
            display: none;
        }

        /* 左右獨立區塊 (預設隱藏，點擊後出現) */
        .taiji-split-left, .taiji-split-right {
            display: none;
            width: 90px;
            height: 140px;
            background: var(--panel-bg);
            border: 2px solid var(--neon-cyan);
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
            align-items: center;
            justify-content: center;
        }

        .core-area.active .taiji-split-left,
        .core-area.active .taiji-split-right {
            display: flex;
        }

        /* 中間爻卦區：由下往上堆疊 (flex-direction: column-reverse) */
        .hexagram-slot {
            display: none;
            flex-direction: column-reverse;
            gap: 6px;
            width: 120px;
            padding: 12px;
            background: rgba(5, 10, 20, 0.95);
            border: 1px dashed rgba(0, 243, 255, 0.4);
            border-radius: 8px;
        }

        .core-area.active .hexagram-slot {
            display: flex;
        }

        .yao-line {
            height: 6px;
            width: 100%;
            opacity: 0;
            border-radius: 2px;
            transition: opacity 0.3s ease;
        }

        .yao-line.dashed {
            opacity: 1;
            border: 1px dashed rgba(0, 243, 255, 0.7);
            background: transparent;
        }

        .yao-line.solid {
            opacity: 1;
            border: none;
            background: var(--neon-cyan);
            box-shadow: 0 0 6px var(--neon-cyan);
        }

        .yao-line.flash {
            opacity: 1;
            border: 1px dashed var(--neon-amber);
            background: rgba(255, 183, 0, 0.3);
            box-shadow: 0 0 8px var(--neon-amber);
            animation: flash-anim 0.8s infinite alternate;
        }

        /* 外環八卦定位容器 */
        .bagua-ring {
            position: absolute;
            width: 480px;
            height: 480px;
            border-radius: 50%;
            pointer-events: none;
        }

        /* 梯形區塊：正向、不旋轉、上窄下寬朝內縮 */
        .bagua-block {
            position: absolute;
            width: 80px;
            height: 50px;
            background: var(--panel-bg);
            clip-path: polygon(15% 0%, 85% 0%, 100% 100%, 0% 100%);
            border: 1px solid var(--border-glow);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: grab;
            pointer-events: auto;
            transition: all 0.2s;
            user-select: none;
        }

        .bagua-block:hover {
            border-color: var(--neon-cyan);
            background: rgba(0, 243, 255, 0.15);
            box-shadow: 0 0 12px var(--neon-cyan);
            transform: scale(1.05);
        }

        .bagua-block .symbol {
            font-size: 1rem;
            font-weight: bold;
            color: #fff;
            line-height: 1;
        }

        .bagua-block .name {
            font-size: 0.55rem;
            color: var(--neon-cyan);
            margin-top: 2px;
        }

        /* 絕對直立不旋轉的 8 個方位座標 */
        .pos-li   { top: 10px;  left: 200px; }
        .pos-kun  { top: 75px;  left: 335px; }
        .pos-dui  { top: 215px; left: 400px; }
        .pos-qian { top: 355px; left: 335px; }
        .pos-kan  { top: 420px; left: 200px; }
        .pos-gen  { top: 355px; left: 65px;  }
        .pos-zhen { top: 215px; left: 0px;   }
        .pos-xun  { top: 75px;  left: 65px;  }

        /* 控制列 */
        .control-panel {
            margin-top: 15px;
            display: flex;
            gap: 15px;
        }

        .cyber-btn {
            background: transparent;
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 8px 18px;
            font-size: 0.7rem;
            letter-spacing: 2px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s;
            box-shadow: inset 0 0 5px rgba(0, 243, 255, 0.2);
        }

        .cyber-btn:hover {
            background: var(--neon-cyan);
            color: var(--bg-color);
            box-shadow: 0 0 15px var(--neon-cyan);
        }

        .status-msg {
            margin-top: 10px;
            font-size: 0.7rem;
            color: var(--neon-amber);
            letter-spacing: 1px;
            height: 20px;
            text-align: center;
        }

        @keyframes flash-anim {
            0% { opacity: 0.3; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Cyber I-Ching v1.0</h1>
        <p>太極左右分離 + 由下往上爻卦 + 正向內縮梯形</p>
    </header>

    <div class="stage-container">
        <!-- 外環八卦 (正向不旋轉、內縮梯形) -->
        <div class="bagua-ring">
            <div class="bagua-block pos-li" draggable="true" data-gua="離"><span class="symbol">☲</span><span class="name">離</span></div>
            <div class="bagua-block pos-kun" draggable="true" data-gua="坤"><span class="symbol">☷</span><span class="name">坤</span></div>
            <div class="bagua-block pos-dui" draggable="true" data-gua="兌"><span class="symbol">☱</span><span class="name">兌</span></div>
            <div class="bagua-block pos-qian" draggable="true" data-gua="乾"><span class="symbol">☰</span><span class="name">乾</span></div>
            <div class="bagua-block pos-kan" draggable="true" data-gua="坎"><span class="symbol">☵</span><span class="name">坎</span></div>
            <div class="bagua-block pos-gen" draggable="true" data-gua="艮"><span class="symbol">☶</span><span class="name">艮</span></div>
            <div class="bagua-block pos-zhen" draggable="true" data-gua="震"><span class="symbol">☳</span><span class="name">震</span></div>
            <div class="bagua-block pos-xun" draggable="true" data-gua="巽"><span class="symbol">☴</span><span class="name">巽</span></div>
        </div>

        <!-- 中央互動核心 -->
        <div class="core-area" id="coreArea" title="點擊進行擲爻">
            
            <!-- 未展開完整太極 -->
            <div class="taiji-united">
                <svg width="100%" height="100%" viewBox="0 0 100 100">
                    <path d="M50,0 A50,50 0 0,1 50,100 A25,25 0 0,1 50,50 A25,25 0 0,0 50,0 Z" fill="#030305"/>
                    <path d="M50,100 A50,50 0 0,1 50,0 A25,25 0 0,1 50,50 A25,25 0 0,0 50,100 Z" fill="#00f3ff"/>
                    <circle cx="50" cy="25" r="5" fill="#00f3ff"/>
                    <circle cx="50" cy="75" r="5" fill="#030305"/>
                </svg>
            </div>

            <!-- 分離左半塊：黑魚 + 上方小圓點 -->
            <div class="taiji-split-left">
                <svg width="60" height="120" viewBox="0 0 50 100">
                    <path d="M50,0 A50,50 0 0,1 50,100 A25,25 0 0,1 50,50 A25,25 0 0,0 50,0 Z" fill="#030305"/>
                    <circle cx="42" cy="25" r="5" fill="#00f3ff"/>
                </svg>
            </div>

            <!-- 中間爻卦槽：嚴格由下往上 (yao-1 在最底) -->
            <div class="hexagram-slot">
                <div class="yao-line" id="yao-6"></div>
                <div class="yao-line" id="yao-5"></div>
                <div class="yao-line" id="yao-4"></div>
                <div class="yao-line" id="yao-3"></div>
                <div class="yao-line" id="yao-2"></div>
                <div class="yao-line" id="yao-1"></div>
            </div>

            <!-- 分離右半塊：白魚 + 下方小圓點 -->
            <div class="taiji-split-right">
                <svg width="60" height="120" viewBox="0 0 50 100">
                    <path d="M0,100 A50,50 0 0,1 0,0 A25,25 0 0,1 0,50 A25,25 0 0,0 0,100 Z" fill="#00f3ff"/>
                    <circle cx="8" cy="75" r="5" fill="#030305"/>
                </svg>
            </div>

        </div>
    </div>

    <div class="status-msg" id="statusMsg">系統就緒：點擊中央太極核心開始由下往上擲初爻</div>

    <div class="control-panel">
        <button class="cyber-btn" id="tossBtn">擲爻 (1/6)</button>
        <button class="cyber-btn" id="resetBtn">重置</button>
    </div>

    <script>
        let step = 0;
        const maxStep = 6;
        const coreArea = document.getElementById('coreArea');
        const tossBtn = document.getElementById('tossBtn');
        const resetBtn = document.getElementById('resetBtn');
        const statusMsg = document.getElementById('statusMsg');

        function executeToss() {
            if (step >= maxStep) {
                statusMsg.textContent = "六爻已全數擲畢，請將外圈卦象拖曳填入中央區域。";
                return;
            }

            if (step === 0) {
                coreArea.classList.add('active');
            }

            step++;
            const currentYao = document.getElementById(`yao-${step}`);
            const dice = Math.random();

            if (dice < 0.25) {
                currentYao.className = "yao-line flash";
                statusMsg.textContent = `第 ${step} 爻（由下往上）生成：捕捉到變爻閃爍！`;
            } else if (dice < 0.6) {
                currentYao.className = "yao-line dashed";
                statusMsg.textContent = `第 ${step} 爻（由下往上）生成：虛線建立。`;
            } else {
                currentYao.className = "yao-line solid";
                statusMsg.textContent = `第 ${step} 爻（由下往上）生成：實線鎖定。`;
            }

            if (step < maxStep) {
                tossBtn.textContent = `擲爻 (${step + 1}/6)`;
            } else {
                tossBtn.textContent = `完成`;
                statusMsg.textContent = "六爻結構由下往上建構完成。";
            }
        }

        tossBtn.addEventListener('click', executeToss);
        coreArea.addEventListener('click', (e) => {
            if (e.target.closest('.bagua-block')) return;
            executeToss();
        });

        resetBtn.addEventListener('click', () => {
            step = 0;
            coreArea.classList.remove('active');
            tossBtn.textContent = "擲爻 (1/6)";
            statusMsg.textContent = "系統已重置，請重新點擊太極擲爻。";
            
            for (let i = 1; i <= maxStep; i++) {
                document.getElementById(`yao-${i}`).className = "yao-line";
            }
        });

        // 拖曳功能
        document.querySelectorAll('.bagua-block').forEach(block => {
            block.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('text/plain', block.dataset.gua);
            });
        });

        coreArea.addEventListener('dragover', (e) => e.preventDefault());
        coreArea.addEventListener('drop', (e) => {
            e.preventDefault();
            const gua = e.dataTransfer.getData('text/plain');
            if (step < 6) {
                statusMsg.textContent = `請先完成六次擲爻，目前進度 (${step}/6)`;
                return;
            }
            statusMsg.textContent = `成功將 [ ${gua}卦 ] 填入核心區域！`;
        });
    </script>
</body>
</html>
