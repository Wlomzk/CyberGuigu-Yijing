<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber I-Ching 賽博易經占卜儀 v5.0 正式修正版</title>
    <style>
        :root {
            --bg-color: #050507;
            --neon-red: #ff3333;
            --neon-amber: #ffb700;
            --panel-bg: rgba(15, 8, 8, 0.95);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: #e0e6ed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(255, 51, 51, 0.03) 0%, transparent 70%),
                linear-gradient(rgba(255, 51, 51, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 51, 51, 0.015) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
        }

        header {
            position: absolute;
            top: 25px;
            text-align: center;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        header h1 {
            font-size: 1.1rem;
            color: var(--neon-red);
            text-shadow: 0 0 10px rgba(255, 51, 51, 0.4);
        }

        header p {
            font-size: 0.65rem;
            color: #888;
            margin-top: 4px;
        }

        .stage-container {
            position: relative;
            width: 520px;
            height: 520px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .core-area {
            position: absolute;
            width: 160px;
            height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
        }

        /* 雙獨立太極魚容器：初始在中心交疊 */
        .taijitu-pair {
            position: absolute;
            width: 140px;
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 獨立黑魚與白魚，各自帶有獨立的魚眼 */
        .fish-left, .fish-right {
            position: absolute;
            width: 70px;
            height: 140px;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .fish-left { left: 0; }
        .fish-right { right: 0; }

        /* 點擊後：兩隻獨立太極魚分別向左右分開，並同時淡出消失 */
        .core-area.active .taijitu-pair {
            opacity: 0;
            transform: scale(0.6);
            pointer-events: none;
        }

        .core-area.active .fish-left {
            transform: translateX(-50px);
        }

        .core-area.active .fish-right {
            transform: translateX(50px);
        }

        /* 中間爻卦區：絕對無邊框，由下往上堆疊 */
        .hexagram-slot {
            position: absolute;
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 110px;
            padding: 10px;
            background: transparent;
            opacity: 0;
            transform: scale(0.9);
            transition: all 0.5s ease;
            pointer-events: none;
        }

        .core-area.active .hexagram-slot {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        /* 嚴格規定：#yao-1 在最下方，#yao-6 在最上方 */
        #yao-6 { order: 1; }
        #yao-5 { order: 2; }
        #yao-4 { order: 3; }
        #yao-3 { order: 4; }
        #yao-2 { order: 5; }
        #yao-1 { order: 6; }

        .yao-line {
            height: 6px;
            width: 100%;
            opacity: 0;
            border-radius: 2px;
            transition: opacity 0.3s ease;
        }

        .yao-line.dashed {
            opacity: 1;
            border: 1px dashed rgba(255, 51, 51, 0.8);
            background: transparent;
        }

        .yao-line.solid {
            opacity: 1;
            border: none;
            background: var(--neon-red);
            box-shadow: 0 0 6px var(--neon-red);
        }

        .yao-line.flash {
            opacity: 1;
            border: 1px dashed var(--neon-amber);
            background: rgba(255, 183, 0, 0.3);
            box-shadow: 0 0 8px var(--neon-amber);
            animation: flash-anim 0.8s infinite alternate;
        }

        .bagua-ring {
            position: absolute;
            width: 480px;
            height: 480px;
            border-radius: 50%;
            pointer-events: none;
        }

        /* 標準八卦扇形梯形：頂端短邊向內朝向太極中心、底端長邊朝外 */
        .bagua-block {
            position: absolute;
            width: 84px;
            height: 52px;
            background: var(--panel-bg);
            /* 上窄下寬（頂短邊朝內指向心，底長邊朝外） */
            clip-path: polygon(20% 0%, 80% 0%, 100% 100%, 0% 100%);
            border: 1px solid rgba(255, 51, 51, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: grab;
            pointer-events: auto;
            transition: all 0.2s;
            user-select: none;
            box-shadow: 0 0 8px rgba(255, 51, 51, 0.15);
        }

        .bagua-block:hover {
            border-color: var(--neon-red);
            background: rgba(255, 51, 51, 0.15);
            box-shadow: 0 0 12px var(--neon-red);
            transform: scale(1.05);
        }

        .bagua-block .symbol {
            font-size: 1rem;
            font-weight: bold;
            color: #ffcccc;
            line-height: 1;
        }

        .bagua-block .name {
            font-size: 0.55rem;
            color: var(--neon-red);
            margin-top: 2px;
        }

        /* 標準八卦方位座標環繞 */
        .pos-li   { top: 12px;  left: 198px; }
        .pos-kun  { top: 78px;  left: 332px; }
        .pos-dui  { top: 214px; left: 398px; }
        .pos-qian { top: 350px; left: 332px; }
        .pos-kan  { top: 416px; left: 198px; }
        .pos-gen  { top: 350px; left: 64px;  }
        .pos-zhen { top: 214px; left: -2px;  }
        .pos-xun  { top: 78px;  left: 64px;  }

        .control-panel {
            margin-top: 15px;
            display: flex;
            gap: 15px;
        }

        .cyber-btn {
            background: transparent;
            border: 1px solid var(--neon-red);
            color: var(--neon-red);
            padding: 8px 18px;
            font-size: 0.7rem;
            letter-spacing: 2px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s;
            box-shadow: inset 0 0 5px rgba(255, 51, 51, 0.2);
        }

        .cyber-btn:hover {
            background: var(--neon-red);
            color: #000;
            box-shadow: 0 0 15px var(--neon-red);
        }

        .status-msg {
            margin-top: 10px;
            font-size: 0.7rem;
            color: var(--neon-amber);
            letter-spacing: 1px;
            height: 20px;
            text-align: center;
        }

        @keyframes flash-anim {
            0% { opacity: 0.3; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Cyber I-Ching v5.0</h1>
        <p>雙獨立太極魚分離淡出 ＋ 標準上窄下寬八卦 ＋ 無邊框由下往上爻序</p>
    </header>

    <div class="stage-container">
        <!-- 外環八卦 -->
        <div class="bagua-ring">
            <div class="bagua-block pos-li" draggable="true" data-gua="離"><span class="symbol">☲</span><span class="name">離</span></div>
            <div class="bagua-block pos-kun" draggable="true" data-gua="坤"><span class="symbol">☷</span><span class="name">坤</span></div>
            <div class="bagua-block pos-dui" draggable="true" data-gua="兌"><span class="symbol">☱</span><span class="name">兌</span></div>
            <div class="bagua-block pos-qian" draggable="true" data-gua="乾"><span class="symbol">☰</span><span class="name">乾</span></div>
            <div class="bagua-block pos-kan" draggable="true" data-gua="坎"><span class="symbol">☵</span><span class="name">坎</span></div>
            <div class="bagua-block pos-gen" draggable="true" data-gua="艮"><span class="symbol">☶</span><span class="name">艮</span></div>
            <div class="bagua-block pos-zhen" draggable="true" data-gua="震"><span class="symbol">☳</span><span class="name">震</span></div>
            <div class="bagua-block pos-xun" draggable="true" data-gua="巽"><span class="symbol">☴</span><span class="name">巽</span></div>
        </div>

        <!-- 中央互動核心 -->
        <div class="core-area" id="coreArea" title="點擊進行擲爻">
            
            <!-- 雙獨立太極魚對組：絕對獨立的兩條魚，各自帶有魚眼 -->
            <div class="taijitu-pair">
                <!-- 左側獨立黑魚（內含白色魚眼） -->
                <div class="fish-left">
                    <svg width="100%" height="100%" viewBox="0 0 70 140">
                        <path d="M70,0 C31.34,0 0,31.34 0,70 C0,108.66 31.34,140 70,140 C52.33,140 35,122.67 35,105 C35,87.33 52.33,70 70,70 C52.33,70 35,52.67 35,35 C35,17.33 52.33,0 70,0 Z" fill="#000000"/>
                        <circle cx="52" cy="35" r="7" fill="#ffffff"/>
                    </svg>
                </div>
                <!-- 右側獨立白魚（內含黑色魚眼） -->
                <div class="fish-right">
                    <svg width="100%" height="100%" viewBox="0 0 70 140">
                        <path d="M0,140 C38.66,140 70,108.66 70,70 C70,31.34 38.66,0 0,0 C17.67,0 35,17.33 35,35 C35,52.67 17.67,70 0,70 C17.67,70 35,87.33 35,105 C35,122.67 17.67,140 0,140 Z" fill="#ffffff"/>
                        <circle cx="18" cy="105" r="7" fill="#000000"/>
                    </svg>
                </div>
            </div>

            <!-- 中間爻卦槽：無邊框，由下往上堆疊 (#yao-1 在最下方) -->
            <div class="hexagram-slot">
                <div class="yao-line" id="yao-6"></div>
                <div class="yao-line" id="yao-5"></div>
                <div class="yao-line" id="yao-4"></div>
                <div class="yao-line" id="yao-3"></div>
                <div class="yao-line" id="yao-2"></div>
                <div class="yao-line" id="yao-1"></div>
            </div>

        </div>
    </div>

    <div class="status-msg" id="statusMsg">系統就緒：點擊中央獨立雙魚開始由下往上擲初爻</div>

    <div class="control-panel">
        <button class="cyber-btn" id="tossBtn">擲爻 (1/6)</button>
        <button class="cyber-btn" id="resetBtn">重置</button>
    </div>

    <script>
        let step = 0;
        const maxStep = 6;
        const coreArea = document.getElementById('coreArea');
        const tossBtn = document.getElementById('tossBtn');
        const resetBtn = document.getElementById('resetBtn');
        const statusMsg = document.getElementById('statusMsg');

        function executeToss() {
            if (step >= maxStep) {
                statusMsg.textContent = "六爻已全數擲畢。";
                return;
            }

            if (step === 0) {
                coreArea.classList.add('active'); // 觸發獨立雙魚向左右分開並淡出消失，露出無邊框爻槽
            }

            step++;
            const currentYao = document.getElementById(`yao-${step}`);
            const dice = Math.random();

            if (dice < 0.25) {
                currentYao.className = "yao-line flash";
                statusMsg.textContent = `第 ${step} 爻（初爻起算）生成：捕捉到變爻閃爍！`;
            } else if (dice < 0.6) {
                currentYao.className = "yao-line dashed";
                statusMsg.textContent = `第 ${step} 爻（初爻起算）生成：虛線建立。`;
            } else {
                currentYao.className = "yao-line solid";
                statusMsg.textContent = `第 ${step} 爻（初爻起算）生成：實線鎖定。`;
            }

            if (step < maxStep) {
                tossBtn.textContent = `擲爻 (${step + 1}/6)`;
            } else {
                tossBtn.textContent = `完成`;
                statusMsg.textContent = "六爻結構由下往上建構完成。";
            }
        }

        tossBtn.addEventListener('click', executeToss);
        coreArea.addEventListener('click', (e) => {
            if (e.target.closest('.bagua-block')) return;
            executeToss();
        });

        resetBtn.addEventListener('click', () => {
            step = 0;
            coreArea.classList.remove('active');
            tossBtn.textContent = "擲爻 (1/6)";
            statusMsg.textContent = "系統已重置，請重新點擊太極雙魚擲爻。";
            
            for (let i = 1; i <= maxStep; i++) {
                document.getElementById(`yao-${i}`).className = "yao-line";
            }
        });

        document.querySelectorAll('.bagua-block').forEach(block => {
            block.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('text/plain', block.dataset.gua);
            });
        });

        coreArea.addEventListener('dragover', (e) => e.preventDefault());
        coreArea.addEventListener('drop', (e) => {
            e.preventDefault();
            const gua = e.dataTransfer.getData('text/plain');
            if (step < 6) {
                statusMsg.textContent = `請先完成六次擲爻，目前進度 (${step}/6)`;
                return;
            }
            statusMsg.textContent = `成功將 [ ${gua}卦 ] 鎖入核心區域！`;
        });
    </script>
</body>
</html>
