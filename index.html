<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber I-Ching 賽博易經占卜儀</title>
    <style>
        :root {
            --bg-color: #050508;
            --neon-cyan: #00f3ff;
            --neon-amber: #ffb700;
            --glass-bg: rgba(10, 15, 30, 0.85);
            --border-color: rgba(0, 243, 255, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: #e0e6ed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 243, 255, 0.05) 0%, transparent 70%),
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
        }

        header {
            position: absolute;
            top: 20px;
            text-align: center;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        header h1 {
            font-size: 1.2rem;
            color: var(--neon-cyan);
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
        }

        header p {
            font-size: 0.7rem;
            color: #6c757d;
            margin-top: 4px;
        }

        .main-container {
            position: relative;
            width: 400px;
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 40px 0;
        }

        /* 中央太極核心 (可展開) */
        .taiji-core {
            position: absolute;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: var(--glass-bg);
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            transition: all 0.5s ease;
        }

        /* 展開狀態：放大並容納依序出現的爻 */
        .taiji-core.expanded {
            width: 220px;
            height: 220px;
            background: rgba(5, 10, 20, 0.95);
            box-shadow: 0 0 35px rgba(0, 243, 255, 0.5), inset 0 0 20px rgba(0, 243, 255, 0.2);
        }

        .taiji-symbol {
            font-size: 2rem;
            color: var(--neon-cyan);
            transition: transform 0.5s ease;
        }

        .core-text {
            font-size: 0.65rem;
            letter-spacing: 2px;
            color: var(--neon-cyan);
            margin-top: 4px;
        }

        .taiji-core.expanded .taiji-symbol {
            font-size: 1.2rem;
            margin-bottom: 4px;
        }

        /* 核心內部的爻卦顯示區 (預設隱藏，展開後顯示) */
        .inner-hexagram {
            display: none;
            flex-direction: column-reverse;
            gap: 5px;
            width: 80px;
            margin-top: 4px;
        }

        .taiji-core.expanded .inner-hexagram {
            display: flex;
        }

        .inner-yao {
            height: 4px;
            width: 100%;
            opacity: 0;
            border-radius: 2px;
            transition: opacity 0.3s ease;
        }

        /* 隱藏外框、無邊框的虛線爻設計 */
        .inner-yao.visible-dashed {
            opacity: 1;
            border: 1px dashed rgba(0, 243, 255, 0.6);
            background: transparent;
        }

        /* 實線爻 */
        .inner-yao.visible-solid {
            opacity: 1;
            border: none;
            background: var(--neon-cyan);
            box-shadow: 0 0 6px var(--neon-cyan);
        }

        /* 動爻閃爍特效 */
        .inner-yao.visible-flash {
            opacity: 1;
            border: 1px dashed var(--neon-amber);
            background: rgba(255, 183, 0, 0.3);
            box-shadow: 0 0 8px var(--neon-amber);
            animation: flash 0.8s infinite alternate;
        }

        /* 外環八卦導航圈 (靜止排列，對應手稿方位) */
        .bagua-ring {
            position: absolute;
            width: 360px;
            height: 360px;
            border-radius: 50%;
            pointer-events: none; /* 讓點擊穿透或獨立運作 */
        }

        .bagua-item {
            position: absolute;
            width: 52px;
            height: 52px;
            background: var(--glass-bg);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: grab;
            pointer-events: auto;
            transition: all 0.2s;
            user-select: none;
        }

        .bagua-item:hover {
            border-color: var(--neon-cyan);
            background: rgba(0, 243, 255, 0.15);
            box-shadow: 0 0 10px var(--neon-cyan);
            transform: scale(1.1);
        }

        .bagua-item .symbol {
            font-size: 1.1rem;
            font-weight: bold;
            color: #fff;
        }

        .bagua-item .name {
            font-size: 0.5rem;
            color: var(--neon-cyan);
        }

        /* 後天八卦手稿精確方位配置 */
        .pos-li { top: 10px; left: 154px; }   /* 離 (南) */
        .pos-kun { top: 55px; left: 270px; }  /* 坤 (西南) */
        .pos-dui { top: 154px; left: 315px; } /* 兌 (西) */
        .pos-qian { top: 255px; left: 270px; }/* 乾 (西北) */
        .pos-kan { top: 298px; left: 154px; } /* 坎 (北) 可展開標註 */
        .pos-gen { top: 255px; left: 40px; }  /* 艮 (東北) */
        .pos-zhen { top: 154px; left: 0px; }  /* 震 (東) */
        .pos-xun { top: 55px; left: 40px; }   /* 巽 (東南) */

        /* 互動控制台 */
        .control-panel {
            margin-top: 15px;
            display: flex;
            gap: 12px;
        }

        .cyber-btn {
            background: transparent;
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 8px 16px;
            font-size: 0.75rem;
            letter-spacing: 2px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s;
            box-shadow: inset 0 0 5px rgba(0, 243, 255, 0.2);
        }

        .cyber-btn:hover {
            background: var(--neon-cyan);
            color: var(--bg-color);
            box-shadow: 0 0 15px var(--neon-cyan);
        }

        .status-bar {
            margin-top: 12px;
            font-size: 0.7rem;
            color: var(--neon-amber);
            letter-spacing: 1px;
            height: 20px;
            text-align: center;
        }

        @keyframes flash {
            0% { opacity: 0.3; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Cyber I-Ching v0.2</h1>
        <p>依手稿架構設計：太極展開與內置層疊虛線爻</p>
    </header>

    <div class="main-container">
        <!-- 外環八卦 (後天方位，固定不旋轉) -->
        <div class="bagua-ring" id="baguaRing">
            <div class="bagua-item pos-li" draggable="true" data-gua="離"><span class="symbol">☲</span><span class="name">離</span></div>
            <div class="bagua-item pos-kun" draggable="true" data-gua="坤"><span class="symbol">☷</span><span class="name">坤</span></div>
            <div class="bagua-item pos-dui" draggable="true" data-gua="兌"><span class="symbol">☱</span><span class="name">兌</span></div>
            <div class="bagua-item pos-qian" draggable="true" data-gua="乾"><span class="symbol">☰</span><span class="name">乾</span></div>
            <div class="bagua-item pos-kan" draggable="true" data-gua="坎"><span class="symbol">☵</span><span class="name">坎</span></div>
            <div class="bagua-item pos-gen" draggable="true" data-gua="艮"><span class="symbol">☶</span><span class="name">艮</span></div>
            <div class="bagua-item pos-zhen" draggable="true" data-gua="震"><span class="symbol">☳</span><span class="name">震</span></div>
            <div class="bagua-item pos-xun" draggable="true" data-gua="巽"><span class="symbol">☴</span><span class="name">巽</span></div>
        </div>

        <!-- 中央太極核心 (點擊可展開並逐步產生爻) -->
        <div class="taiji-core" id="taijiCore" title="點擊太極進行擲爻">
            <div class="taiji-symbol">☯</div>
            <div class="core-text" id="coreText">點擊展開</div>
            
            <!-- 內部爻卦顯示區 (預設隱藏，無外框) -->
            <div class="inner-hexagram" id="innerHexagram">
                <div class="inner-yao" id="yao-6"></div>
                <div class="inner-yao" id="yao-5"></div>
                <div class="inner-yao" id="yao-4"></div>
                <div class="inner-yao" id="yao-3"></div>
                <div class="inner-yao" id="yao-2"></div>
                <div class="inner-yao" id="yao-1"></div>
            </div>
        </div>
    </div>

    <div class="status-bar" id="statusBar">系統就緒：請點擊中央太極核心開始擲初爻</div>

    <div class="control-panel">
        <button class="cyber-btn" id="tossBtn">擲爻 (1/6)</button>
        <button class="cyber-btn" id="resetBtn">重置</button>
    </div>

    <script>
        let currentYaoStep = 0;
        const totalYaos = 6;
        const taijiCore = document.getElementById('taijiCore');
        const coreText = document.getElementById('coreText');
        const tossBtn = document.getElementById('tossBtn');
        const resetBtn = document.getElementById('resetBtn');
        const statusBar = document.getElementById('statusBar');

        function performToss() {
            if (currentYaoStep >= totalYaos) {
                statusBar.textContent = "六爻已全數擲畢，請拖曳外圈卦象填滿區域。";
                return;
            }

            // 擲第一爻時自動展開太極
            if (currentYaoStep === 0) {
                taijiCore.classList.add('expanded');
                coreText.textContent = "動態演算中";
            }

            currentYaoStep++;
            const targetYao = document.getElementById(`yao-${currentYaoStep}`);
            
            // 模擬隨機狀態：實線、虛線、或帶有閃爍特效的動爻
            const rand = Math.random();
            if (rand < 0.25) {
                targetYao.className = "inner-yao visible-flash";
                statusBar.textContent = `第 ${currentYaoStep} 爻生成：捕捉到變爻閃爍！`;
            } else if (rand < 0.6) {
                targetYao.className = "inner-yao visible-dashed";
                statusBar.textContent = `第 ${currentYaoStep} 爻生成：虛線建立。`;
            } else {
                targetYao.className = "inner-yao visible-solid";
                statusBar.textContent = `第 ${currentYaoStep} 爻生成：實線鎖定。`;
            }

            if (currentYaoStep < totalYaos) {
                tossBtn.textContent = `擲爻 (${currentYaoStep + 1}/6)`;
            } else {
                tossBtn.textContent = `完成`;
                statusBar.textContent = "六爻結構建構完成。";
            }
        }

        // 綁定按鈕與太極點擊事件
        tossBtn.addEventListener('click', performToss);
        taijiCore.addEventListener('click', (e) => {
            // 避免拖曳或點到子元素時重複觸發
            if (e.target.closest('.bagua-item')) return;
            performToss();
        });

        // 重置系統
        resetBtn.addEventListener('click', () => {
            currentYaoStep = 0;
            taijiCore.classList.remove('expanded');
            coreText.textContent = "點擊展開";
            tossBtn.textContent = "擲爻 (1/6)";
            statusBar.textContent = "系統已重置，請重新點擊太極擲爻。";
            
            for (let i = 1; i <= totalYaos; i++) {
                const yao = document.getElementById(`yao-${i}`);
                yao.className = "inner-yao";
            }
        });

        // 拖曳互動
        const baguaItems = document.querySelectorAll('.bagua-item');
        baguaItems.forEach(item => {
            item.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('text/plain', item.dataset.gua);
            });
        });

        taijiCore.addEventListener('dragover', (e) => e.preventDefault());
        taijiCore.addEventListener('drop', (e) => {
            e.preventDefault();
            const guaName = e.dataTransfer.getData('text/plain');
            if (currentYaoStep < 6) {
                statusBar.textContent = `請先完成六次擲爻，目前進度 (${currentYaoStep}/6)`;
                return;
            }
            statusBar.textContent = `成功將 [ ${guaName}卦 ] 填入核心區域！`;
            taijiCore.style.borderColor = 'var(--neon-amber)';
            setTimeout(() => {
                taijiCore.style.borderColor = 'var(--neon-cyan)';
            }, 1000);
        });
    </script>
</body>
</html>
